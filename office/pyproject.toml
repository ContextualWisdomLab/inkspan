[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inkspan-office"
version = "0.1.0"
description = "Deterministic JSON-to-DOCX/XLSX/PPTX renderer for AI-authored Inkspan documents"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ContextualWisdomLab" }]
keywords = ["inkspan", "llm", "docx", "xlsx", "pptx", "office-open-xml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business"
]
dependencies = [
  "python-docx>=1.2.0,<2",
  "openpyxl>=3.1.5,<4",
  "python-pptx>=1.0.2,<2"
]

[project.optional-dependencies]
test = ["coverage==7.15.3", "pytest==9.0.3"]

[project.urls]
Repository = "https://github.com/ContextualWisdomLab/inkspan"
Issues = "https://github.com/ContextualWisdomLab/inkspan/issues"

[project.scripts]
inkspan-office = "inkspan_office.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inkspan_office = ["schema.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["inkspan_office"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
