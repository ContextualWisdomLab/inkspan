name: Patch image alt README

on:
  push:
    branches: [feat/accessible-image-alt-text]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/accessible-image-alt-text
      - name: Document accessible image alternatives
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = '''- **Self-contained images** — paste, drop, or upload images as inline base64
  data URIs. Configurable size limits and downscaling keep the document portable
  and directly readable by downstream LLMs.
'''
          new = '''- **Self-contained, accessible images** — paste, drop, or upload images as
  inline base64 data URIs, then author meaningful alternative text or explicitly
  mark decorative images. Configurable limits keep documents portable and LLM-ready.
'''
          if old not in text:
              raise SystemExit('missing image capability anchor')
          text = text.replace(old, new, 1)

          old = '''The table toolbar supports add/delete row, add/delete column, and delete table.
Toolbar active and disabled states follow editor transactions and selection
updates.
'''
          new = '''The table toolbar supports add/delete row, add/delete column, and delete table.
When an image is selected, the **Alt** action prefills its current replacement
text. Enter a meaningful description for informative images, or leave the value
empty to produce an explicit `alt=""` for decorative images. Upload, paste, and
drop start with that explicit decorative default instead of omitting `alt`.
Toolbar active and disabled states follow editor transactions and selection
updates.
'''
          if old not in text:
              raise SystemExit('missing toolbar documentation anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit README and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/patch-image-alt-readme.yml
          git commit -m "docs: explain accessible image alternatives"
          git push origin HEAD:feat/accessible-image-alt-text
