name: Fix autosave latest revision ordering

on:
  push:
    branches:
      - feat/autosave-coalescing-queue

permissions:
  contents: write

concurrency:
  group: fix-autosave-latest-ordering
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/autosave-coalescing-queue
          fetch-depth: 0
      - name: Apply bounded fail-closed ordering fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          implementation = Path('src/autosave/index.ts')
          text = implementation.read_text(encoding='utf-8')

          active_old = '''    if (activeRequest?.strongEntityTag === strongEntityTag) {
      return activeRequest.promise;
    }
'''
          active_new = '''    if (activeRequest?.strongEntityTag === strongEntityTag) {
      if (pendingRequest !== null) {
        const supersededRequest = pendingRequest;
        pendingRequest = null;
        resolveRequest(
          supersededRequest,
          createSupersededOutcome(
            supersededRequest.strongEntityTag,
            strongEntityTag,
          ),
        );
      }
      return activeRequest.promise;
    }
'''
          if active_old in text:
              text = text.replace(active_old, active_new, 1)
          elif active_new not in text:
              raise SystemExit('active-revision ordering target is missing')

          schema_old = '''    typeof envelopeRecord.schemaId !== 'string' ||
    envelopeRecord.schemaId.length === 0 ||
    typeof envelopeRecord.schemaVersion !== 'number' ||
    !Number.isSafeInteger(envelopeRecord.schemaVersion) ||
    envelopeRecord.schemaVersion < 1 ||
'''
          schema_new = '''    envelopeRecord.schemaId !==
      'https://inkspan.io/schemas/document-envelope/v1' ||
    envelopeRecord.schemaVersion !== 1 ||
'''
          if schema_old in text:
              text = text.replace(schema_old, schema_new, 1)
          elif schema_new not in text:
              raise SystemExit('schema-evidence validation target is missing')

          doc_old = '''   * Matching active or pending revisions share one promise. A newer different
   * revision replaces only not-yet-started work; it never cancels or overlaps an
   * active host call. Invalid evidence fails synchronously before it is stored.
'''
          doc_new = '''   * Matching active or pending revisions share one promise. Re-enqueueing the
   * active revision supersedes a different pending revision because the active
   * callback will finish after the latest request. Any other newer revision
   * replaces only not-yet-started work; it never cancels or overlaps an active
   * host call. Invalid or unsupported-schema evidence fails synchronously before
   * it is stored.
'''
          if doc_old in text:
              text = text.replace(doc_old, doc_new, 1)
          implementation.write_text(text, encoding='utf-8')

          package = Path('src/autosave/package.ts')
          package_text = package.read_text(encoding='utf-8')
          package_old = '''   * Queue one immutable revision for the host-owned save operation.
   *
   * @param evidence - Frozen evidence returned by Inkspan revision APIs.
'''
          package_new = '''   * Queue one immutable revision for the host-owned save operation.
   *
   * Matching active or pending revisions share one result. Re-enqueueing the
   * active revision supersedes a different pending revision so the latest
   * requested revision remains the final queued durable target.
   *
   * @param evidence - Frozen evidence returned by Inkspan revision APIs.
'''
          if package_old in package_text:
              package_text = package_text.replace(package_old, package_new, 1)
              package.write_text(package_text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          changelog_old = '- Same-revision active and pending callers share one outcome; an idle revision is `unchanged` only while the queue still knows it is durably current and no active or pending write can replace it\n'
          changelog_new = '- Same-revision active and pending callers share one outcome; re-enqueueing the active revision supersedes a different pending revision, and an idle revision is `unchanged` only while the queue still knows it is durably current and no active or pending write can replace it\n'
          if changelog_old in changelog_text:
              changelog.write_text(changelog_text.replace(changelog_old, changelog_new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-autosave-latest-ordering.yml
          git add src/autosave/index.ts src/autosave/package.ts CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve latest autosave revision ordering'
          git push origin HEAD:feat/autosave-coalescing-queue
