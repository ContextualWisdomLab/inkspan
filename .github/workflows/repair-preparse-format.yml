name: Repair preparse parser formatting once

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/repair-preparse-format.yml

permissions:
  contents: write

concurrency:
  group: repair-preparse-parser-formatting
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/inkspan' &&
      github.event.pull_request.head.ref == 'security/preparse-envelope-limits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/preparse-envelope-limits
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Repair indentation and validate coverage
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/documentEnvelope.ts')
          source = path.read_text(encoding='utf-8')
          start_marker = '    const inspection = inspectJsonText(source, {'
          end_marker = '    try {'
          start_index = source.find(start_marker)
          end_index = source.find(end_marker, start_index)
          if start_index < 0 or end_index < 0:
              raise SystemExit('Expected preparse block is missing')
          block = (
              "    const inspection = inspectJsonText(source, {\n"
              "      maxValues: Math.min(\n"
              "        Number.MAX_SAFE_INTEGER,\n"
              "        resolvedLimits.maxJsonValues + 3,\n"
              "      ),\n"
              "      maxDepth: Math.min(\n"
              "        Number.MAX_SAFE_INTEGER,\n"
              "        resolvedLimits.maxNestingDepth + 1,\n"
              "      ),\n"
              "    });\n"
              "    if (inspection === 'duplicate-object-name') {\n"
              "      throw new DocumentEnvelopeError(\n"
              "        'Document envelope JSON must not contain duplicate object names',\n"
              "      );\n"
              "    }\n"
              "    if (inspection === 'value-count-limit') {\n"
              "      throw new DocumentEnvelopeError(\n"
              "        'Document envelope exceeds the supported JSON value count',\n"
              "      );\n"
              "    }\n"
              "    if (inspection === 'nesting-depth-limit') {\n"
              "      throw new DocumentEnvelopeError(\n"
              "        'Document envelope exceeds the supported document nesting depth',\n"
              "      );\n"
              "    }\n"
          )
          path.write_text(
              source[:start_index] + block + source[end_index:],
              encoding='utf-8',
          )
          PY
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm coverage
          rm .github/workflows/format-preparse-envelope-limits.yml
          rm .github/workflows/repair-preparse-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "style: normalize envelope preparse validation"
          git push origin HEAD:security/preparse-envelope-limits
