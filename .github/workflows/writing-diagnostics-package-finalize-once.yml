name: Writing Diagnostics Package Finalize Once

on:
  push:
    branches:
      - feat/writing-diagnostics-package
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: writing-diagnostics-package-finalize-once-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  finalize-package-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish explicit package map and scripts
        run: |
          python <<'PY'
          import json
          from pathlib import Path

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))

          diagnostics_export = {
              'types': './dist/writing-diagnostics/index.d.ts',
              'import': './dist/cwl-writing-diagnostics.js',
              'require': './dist/cwl-writing-diagnostics.cjs',
          }
          exports = package['exports']
          if './writing-diagnostics' in exports:
              if exports['./writing-diagnostics'] != diagnostics_export:
                  raise SystemExit('existing writing-diagnostics export differs')
          else:
              rebuilt = {}
              inserted = False
              for key, value in exports.items():
                  rebuilt[key] = value
                  if key == './text-position-selector':
                      rebuilt['./writing-diagnostics'] = diagnostics_export
                      inserted = True
              if not inserted:
                  raise SystemExit('text-position-selector export anchor missing')
              package['exports'] = rebuilt

          scripts = package['scripts']
          build_anchor = (
              'vite build --config vite.text-position-selector.config.ts && '
              'vite build --config vite.markdown.config.ts'
          )
          build_replacement = (
              'vite build --config vite.text-position-selector.config.ts && '
              'vite build --config vite.writing-diagnostics.config.ts && '
              'vite build --config vite.markdown.config.ts'
          )
          if 'vite.writing-diagnostics.config.ts' not in scripts['build']:
              if scripts['build'].count(build_anchor) != 1:
                  raise SystemExit('build script anchor changed')
              scripts['build'] = scripts['build'].replace(
                  build_anchor,
                  build_replacement,
                  1,
              )

          verifier = 'node ./scripts/verify-writing-diagnostics-subpath-package.mjs'
          verify_anchor = (
              'node ./scripts/verify-text-position-selector-subpath-package.mjs && '
              'node ./scripts/verify-markdown-subpath-package.mjs'
          )
          verify_replacement = (
              'node ./scripts/verify-text-position-selector-subpath-package.mjs && '
              f'{verifier} && '
              'node ./scripts/verify-markdown-subpath-package.mjs'
          )
          if verifier not in scripts['verify:package']:
              if scripts['verify:package'].count(verify_anchor) != 1:
                  raise SystemExit('package verifier anchor changed')
              scripts['verify:package'] = scripts['verify:package'].replace(
                  verify_anchor,
                  verify_replacement,
                  1,
              )

          package_path.write_text(
              json.dumps(package, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
      - name: Verify focused package contract
        run: |
          pnpm exec vitest run \
            src/writingDiagnosticsPackage.test.ts \
            src/writingDiagnosticsExports.test.ts \
            --pool=forks --maxWorkers=1
          pnpm typecheck
          pnpm build
          node ./scripts/verify-writing-diagnostics-subpath-package.mjs
      - name: Publish validated package map and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-package
        run: |
          set -euo pipefail
          rm .github/workflows/writing-diagnostics-package-finalize-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json .github/workflows/writing-diagnostics-package-finalize-once.yml
          git diff --cached --check
          git commit -m 'feat(diagnostics): publish explicit package subpath'
          git push origin "HEAD:${TARGET_BRANCH}"
