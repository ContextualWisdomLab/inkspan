name: Patch image alt docs and regression count

on:
  push:
    branches: [feat/accessible-image-alt-text]

permissions:
  contents: write

concurrency:
  group: patch-image-alt-docs
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/accessible-image-alt-text
      - name: Patch README and toolbar regression expectation
        run: |
          python - <<'PY'
          from pathlib import Path

          toolbar_test = Path('src/components/Toolbar.test.tsx')
          toolbar = toolbar_test.read_text()
          old_count = 'expect(buttons).toHaveLength(22);'
          if old_count not in toolbar:
              raise SystemExit('missing toolbar button-count anchor')
          toolbar_test.write_text(toolbar.replace(old_count, 'expect(buttons).toHaveLength(23);', 1))

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old_bullet = '''- **Self-contained images** — paste, drop, or upload images as inline base64
  data URIs. Configurable size limits and downscaling keep the document portable
  and directly readable by downstream LLMs.
'''
          new_bullet = '''- **Self-contained, accessible images** — paste, drop, or upload images as
  inline base64 data URIs, then author meaningful alternative text or explicitly
  mark decorative images. Configurable limits keep documents portable and LLM-ready.
'''
          if old_bullet not in readme:
              raise SystemExit('missing README image-capability anchor')
          readme = readme.replace(old_bullet, new_bullet, 1)

          old_usage = '''The table toolbar supports add/delete row, add/delete column, and delete table.
Toolbar active and disabled states follow editor transactions and selection
updates.
'''
          new_usage = '''The table toolbar supports add/delete row, add/delete column, and delete table.
When an image is selected, the **Alt** action prefills its current replacement
text. Enter a meaningful description for informative images, or leave the value
empty to produce an explicit `alt=""` for decorative images. Upload, paste, and
drop start with that explicit decorative default instead of omitting `alt`.
Toolbar active and disabled states follow editor transactions and selection
updates.
'''
          if old_usage not in readme:
              raise SystemExit('missing README toolbar anchor')
          readme_path.write_text(readme.replace(old_usage, new_usage, 1))
          PY
      - name: Commit patches and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md src/components/Toolbar.test.tsx
          git rm .github/workflows/patch-image-alt-docs.yml
          git commit -m "docs: explain accessible image alternatives"
          git push origin HEAD:feat/accessible-image-alt-text
