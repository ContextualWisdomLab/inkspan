name: Writing Diagnostics Controller TDD

on:
  push:
    branches:
      - feat/writing-diagnostics-controller
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writing-diagnostics-controller-tdd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  focused-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run revision-bound controller contract tests
        run: pnpm exec vitest run src/components/useWritingDiagnosticsController.test.tsx src/components/useWritingDiagnosticsController.actions.test.tsx
      - name: Prove complete owned production coverage
        shell: bash
        run: |
          set +e
          pnpm exec vitest run --coverage --coverage.reporter=json
          status=$?
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('coverage/coverage-final.json', 'utf8'));
          const entry = Object.entries(report).find(([path]) => path.endsWith('/src/components/useWritingDiagnosticsController.ts'));
          if (!entry) {
            console.log('::error title=Controller coverage gaps::controller coverage entry missing');
            process.exit(0);
          }
          const [, file] = entry;
          const statements = Object.entries(file.s).filter(([, count]) => count === 0).map(([id]) => file.statementMap[id].start.line);
          const functions = Object.entries(file.f).filter(([, count]) => count === 0).map(([id]) => file.fnMap[id].loc.start.line);
          const branches = [];
          for (const [id, counts] of Object.entries(file.b)) {
            counts.forEach((count, index) => {
              if (count === 0) branches.push(`${file.branchMap[id].loc.start.line}:${index}`);
            });
          }
          if (statements.length || functions.length || branches.length) {
            console.log(`::error title=Controller coverage gaps::statements=${[...new Set(statements)].join(',')}; functions=${[...new Set(functions)].join(',')}; branches=${branches.join(',')}`);
          }
          NODE
          exit "$status"
      - name: Typecheck controller and public action contracts
        run: pnpm typecheck
