name: Writing Diagnostics Panel TDD

on:
  push:
    branches:
      - feat/writing-diagnostics-panel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writing-diagnostics-panel-tdd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  focused-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run panel accessibility, shell, and style contracts
        run: pnpm exec vitest run src/components/WritingDiagnosticsPanel.test.tsx src/components/EditorFrame.test.tsx src/writingDiagnosticsStyles.test.ts
      - name: Typecheck panel contract
        run: pnpm typecheck
