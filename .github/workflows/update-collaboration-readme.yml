name: Update collaboration README

on:
  push:
    branches: [feat/provider-neutral-collaboration]

permissions:
  contents: write

concurrency:
  group: collaboration-readme
  cancel-in-progress: false

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/provider-neutral-collaboration
      - name: Add collaboration product documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          replacements = [
              (
                  'base64 images, offline multilingual fonts, email-ready serialization, a\nframework-independent data-URI converter, and a deterministic Office Open XML\nrenderer for DOCX, XLSX, and PPTX.',
                  'base64 images, provider-neutral Yjs collaboration, offline multilingual\nfonts, email-ready serialization, a framework-independent data-URI converter,\nand a deterministic Office Open XML renderer for DOCX, XLSX, and PPTX.',
              ),
              (
                  '- **Host-grade control** — controlled/uncontrolled modes, an imperative ref API,\n  AI insertion at the current selection, read-only mode, image-error reporting,\n  and access to the underlying TipTap instance.\n',
                  '- **Host-grade control** — controlled/uncontrolled modes, an imperative ref API,\n  AI insertion at the current selection, read-only mode, image-error reporting,\n  and access to the underlying TipTap instance.\n- **Provider-neutral collaboration** — opt-in Yjs/TipTap real-time editing with\n  host-owned transport, persistence, authorization, and lifecycle boundaries.\n',
              ),
              (
                  '| React editor | `@contextualwisdomlab/cwl-editor` | Markdown/HTML WYSIWYG component and serializers |\n',
                  '| React editor | `@contextualwisdomlab/cwl-editor` | Markdown/HTML WYSIWYG component and serializers |\n| Collaboration | `@contextualwisdomlab/cwl-editor/collaboration` | Provider-neutral Yjs collaborative editing |\n',
              ),
              (
                  '## Markdown, HTML, and email serialization\n',
                  '## Real-time collaboration\n\nImport `CollaborativeCwlEditor` from the opt-in collaboration entrypoint and\nprovide a stable, host-owned `Y.Doc`. Inkspan does not open a connection, store\ncredentials, persist updates, enforce document authorization, or destroy the\nhost provider. Collaborative mode uses Yjs as the sole source of truth and\ndisables local StarterKit history.\n\nSee [`docs/collaboration.md`](docs/collaboration.md) for the provider contract,\npresence/privacy rules, lifecycle ownership, accessibility behavior, persistence\nmodel, and CWL/naruon service boundary.\n\n## Markdown, HTML, and email serialization\n',
              ),
              (
                  '  components/      React editor and toolbar\n',
                  '  collaboration/   Provider-neutral Yjs editor, awareness, and presence\n  components/      Shared React editor frame, standalone editor, and toolbar\n',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'missing README anchor: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit README and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/update-collaboration-readme.yml
          git commit -m "docs: expose provider-neutral collaboration"
          git push origin HEAD:feat/provider-neutral-collaboration
