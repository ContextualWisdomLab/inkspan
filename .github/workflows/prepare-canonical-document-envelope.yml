name: Prepare canonical document envelope

on:
  push:
    branches:
      - feat/canonical-document-envelope

permissions:
  contents: write

concurrency:
  group: prepare-canonical-document-envelope
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/canonical-document-envelope
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Implement canonical envelope serialization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          (root / 'src/documentEnvelopeCanonical.ts').write_text(r'''import type { CwlEditorDocumentEnvelope } from './documentEnvelope.js';
import {
  DocumentEnvelopeError,
  parseDocumentEnvelope,
} from './documentEnvelope.js';

type CanonicalJsonValue =
  | null
  | boolean
  | number
  | string
  | readonly CanonicalJsonValue[]
  | CanonicalJsonObject;

type CanonicalJsonObject = Readonly<
  Record<string, CanonicalJsonValue>
>;

const INVALID_UNICODE_MESSAGE =
  'Document envelope must contain valid Unicode scalar strings';

/**
 * Serialize a valid Inkspan envelope to deterministic RFC 8785-style JSON.
 *
 * Object property names are sorted recursively by UTF-16 code units, array
 * order is preserved, ECMAScript JSON primitive serialization is used, and no
 * insignificant whitespace is emitted. Lone UTF-16 surrogates fail closed.
 */
export function serializeDocumentEnvelope(source: unknown): string {
  const envelope = parseDocumentEnvelope(source);
  return serializeCanonicalValue(
    envelope as unknown as CanonicalJsonObject,
  );
}

/** Encode a canonical Inkspan envelope as UTF-8 bytes without a BOM. */
export function encodeDocumentEnvelope(source: unknown): Uint8Array {
  return new TextEncoder().encode(serializeDocumentEnvelope(source));
}

function serializeCanonicalValue(value: CanonicalJsonValue): string {
  if (value === null) return 'null';
  if (typeof value === 'boolean') return value ? 'true' : 'false';
  if (typeof value === 'number') return JSON.stringify(value) as string;
  if (typeof value === 'string') {
    assertUnicodeScalarString(value);
    return JSON.stringify(value) as string;
  }
  if (Array.isArray(value)) {
    return `[${value.map(serializeCanonicalValue).join(',')}]`;
  }

  const objectValue = value as CanonicalJsonObject;
  const keys = Object.keys(objectValue).sort();
  return `{${keys
    .map((key) => {
      assertUnicodeScalarString(key);
      return `${JSON.stringify(key)}:${serializeCanonicalValue(
        objectValue[key],
      )}`;
    })
    .join(',')}}`;
}

function assertUnicodeScalarString(value: string): void {
  for (let index = 0; index < value.length; index += 1) {
    const codeUnit = value.charCodeAt(index);
    if (codeUnit >= 0xd800 && codeUnit <= 0xdbff) {
      const nextCodeUnit = value.charCodeAt(index + 1);
      if (nextCodeUnit >= 0xdc00 && nextCodeUnit <= 0xdfff) {
        index += 1;
        continue;
      }
      throw new DocumentEnvelopeError(INVALID_UNICODE_MESSAGE);
    }
    if (codeUnit >= 0xdc00 && codeUnit <= 0xdfff) {
      throw new DocumentEnvelopeError(INVALID_UNICODE_MESSAGE);
    }
  }
}

/** Compile-time assertion that the public envelope remains canonicalizable. */
const _documentEnvelopeCompatibility: CwlEditorDocumentEnvelope | undefined =
  undefined;
void _documentEnvelopeCompatibility;
''', encoding='utf-8')

          (root / 'src/documentEnvelopeCanonical.test.ts').write_text(r'''import { describe, expect, it } from 'vitest';
import {
  DOCUMENT_ENVELOPE_SCHEMA_ID,
  DOCUMENT_ENVELOPE_SCHEMA_VERSION,
  DocumentEnvelopeError,
  createDocumentEnvelope,
} from './documentEnvelope.js';
import {
  encodeDocumentEnvelope,
  serializeDocumentEnvelope,
} from './documentEnvelopeCanonical.js';

describe('canonical document envelope serialization', () => {
  it('sorts object properties recursively while preserving array order', () => {
    const envelope = createDocumentEnvelope({
      type: 'doc',
      attrs: { zeta: 1, alpha: 2, active: true, absent: null },
      content: [
        {
          type: 'paragraph',
          attrs: { second: false, first: 'value' },
        },
      ],
    });

    expect(serializeDocumentEnvelope(envelope)).toBe(
      `{"documentJson":{"attrs":{"absent":null,"active":true,"alpha":2,"zeta":1},"content":[{"attrs":{"first":"value","second":false},"type":"paragraph"}],"type":"doc"},"schemaId":"${DOCUMENT_ENVELOPE_SCHEMA_ID}","schemaVersion":${DOCUMENT_ENVELOPE_SCHEMA_VERSION}}`,
    );
  });

  it('produces identical text for equivalent insertion orders', () => {
    const first = createDocumentEnvelope({
      type: 'doc',
      attrs: { beta: 2, alpha: 1 },
    });
    const second = createDocumentEnvelope({
      attrs: { alpha: 1, beta: 2 },
      type: 'doc',
    });

    expect(serializeDocumentEnvelope(first)).toBe(
      serializeDocumentEnvelope(second),
    );
  });

  it('uses ECMAScript number serialization and RFC 8785 UTF-16 key order', () => {
    const envelope = createDocumentEnvelope({
      type: 'doc',
      attrs: {
        numbers: [333333333.33333329, 1e30, 4.5, 2e-3, 1e-27],
        '\u20ac': 'Euro Sign',
        '\r': 'Carriage Return',
        '\ufb33': 'Hebrew Letter Dalet With Dagesh',
        '1': 'One',
        '\ud83d\ude00': 'Emoji: Grinning Face',
        '\u0080': 'Control',
        '\u00f6': 'Latin Small Letter O With Diaeresis',
      },
    });

    const serialized = serializeDocumentEnvelope(envelope);
    expect(serialized).toContain(
      '"numbers":[333333333.3333333,1e+30,4.5,0.002,1e-27]',
    );
    const orderedValues = [
      'Carriage Return',
      'One',
      'Control',
      'Latin Small Letter O With Diaeresis',
      'Euro Sign',
      'Emoji: Grinning Face',
      'Hebrew Letter Dalet With Dagesh',
    ];
    const offsets = orderedValues.map((value) => serialized.indexOf(value));
    expect(offsets.every((offset) => offset >= 0)).toBe(true);
    expect(offsets).toEqual([...offsets].sort((left, right) => left - right));
  });

  it('encodes canonical JSON as UTF-8 without a byte-order mark', () => {
    const envelope = createDocumentEnvelope({
      type: 'doc',
      attrs: { label: '문서 😀' },
    });

    const text = serializeDocumentEnvelope(envelope);
    const bytes = encodeDocumentEnvelope(envelope);

    expect(new TextDecoder().decode(bytes)).toBe(text);
    expect([...bytes.slice(0, 3)]).not.toEqual([0xef, 0xbb, 0xbf]);
  });

  it.each([
    { type: 'doc', attrs: { value: '\ud800' } },
    { type: 'doc', attrs: { value: '\udc00' } },
    { type: 'doc', attrs: { ['\ud800']: 'invalid-key' } },
    { type: 'doc', attrs: { ['\udc00']: 'invalid-key' } },
  ])('rejects lone UTF-16 surrogates: %j', (documentJson) => {
    const envelope = createDocumentEnvelope(documentJson);
    expect(() => serializeDocumentEnvelope(envelope)).toThrow(
      DocumentEnvelopeError,
    );
    expect(() => serializeDocumentEnvelope(envelope)).toThrow(
      'valid Unicode scalar strings',
    );
  });

  it('applies the existing fail-closed envelope contract before serialization', () => {
    expect(() =>
      serializeDocumentEnvelope({
        schemaId: DOCUMENT_ENVELOPE_SCHEMA_ID,
        schemaVersion: 999,
        documentJson: { type: 'doc' },
      }),
    ).toThrow(DocumentEnvelopeError);
  });
});
''', encoding='utf-8')

          (root / 'docs/canonical-document-envelope.md').write_text(r'''# Canonical document envelopes

Inkspan exposes `serializeDocumentEnvelope()` and `encodeDocumentEnvelope()` for deterministic persistence, comparison, hashing, signing, deduplication, and optimistic-concurrency inputs.

```ts
import {
  createDocumentEnvelope,
  encodeDocumentEnvelope,
  serializeDocumentEnvelope,
} from '@contextualwisdomlab/cwl-editor';

const envelope = createDocumentEnvelope(editorRef.current!.getSnapshot().documentJson);
const canonicalJson = serializeDocumentEnvelope(envelope);
const canonicalUtf8 = encodeDocumentEnvelope(envelope);
```

## Deterministic contract

The serializer follows the JSON Canonicalization Scheme rules relevant to an already validated Inkspan envelope:

- no insignificant whitespace;
- ECMAScript JSON serialization for literals, strings, and IEEE-754 numbers;
- recursive property sorting by raw UTF-16 code units;
- unchanged array element order;
- unchanged Unicode content, without normalization;
- rejection of lone UTF-16 surrogates;
- UTF-8 output without a byte-order mark from `encodeDocumentEnvelope()`.

The canonical envelope is suitable as the input to a host-owned digest or signature function. Inkspan intentionally does not select a hash, key, signing service, object-store key, or conflict-resolution policy.

## Trust and compatibility boundary

Canonicalization does not authorize a write and does not prove that document content is safe or semantically valid. Before persistence or restoration, CWL and naruon hosts remain responsible for:

1. authenticating the caller and authorizing the descriptive nonnumeric document identifier;
2. enforcing tenant isolation, document size, retention, encryption, and logging policy;
3. parsing the envelope and validating `documentJson` against the active editor schema;
4. selecting and recording explicit migrations when schema versions change;
5. comparing canonical bytes only within the same documented envelope and extension contract.

`parseDocumentEnvelope()` remains fail-closed for unknown fields, schema identifiers, and versions. `validateDocumentJson()` or `CwlEditorHandle.validateDocumentJson()` remains the active-schema preflight before `setDocumentJson()`.

## Raw JSON input

RFC 8785 requires duplicate object property names to be rejected before canonicalization. JavaScript's native `JSON.parse()` does not retain evidence of duplicate names. For signed or adversarial raw JSON protocols, hosts must use an I-JSON parser that rejects duplicate names before passing the resulting value into Inkspan. Envelopes created in memory with `createDocumentEnvelope()` do not contain duplicate object keys.

## Standards basis

- RFC 8785, JSON Canonicalization Scheme
- RFC 7493, The I-JSON Message Format
- RFC 8259, The JavaScript Object Notation Data Interchange Format
- ECMAScript JSON serialization and UTF-16 string ordering
''', encoding='utf-8')

