name: Normalize release changelog layout

on:
  push:
    branches:
      - feat/conflict-evidence
    paths:
      - .github/workflows/normalize-changelog-release.yml

permissions:
  contents: write

concurrency:
  group: normalize-changelog-release
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/conflict-evidence
          fetch-depth: 0
      - name: Normalize release heading spacing
        shell: python
        run: |
          import re
          from pathlib import Path

          changelog_path = Path('CHANGELOG.md')
          original = changelog_path.read_text(encoding='utf-8')
          normalized = re.sub(
              r'(## \[Unreleased\]\n)\n+',
              r'\1\n',
              original,
              count=1,
          )
          normalized = re.sub(
              r'([^\n])\n(## \[0\.5\.23\])',
              r'\1\n\n\2',
              normalized,
              count=1,
          )
          if normalized == original:
              raise SystemExit('Expected changelog spacing defects were not found')
          changelog_path.write_text(normalized, encoding='utf-8')
          Path('.github/workflows/normalize-changelog-release.yml').unlink()
      - name: Commit normalized changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/normalize-changelog-release.yml
          git commit -m "docs: normalize Inkspan 0.5.24 changelog layout"
          git push origin HEAD:feat/conflict-evidence
