name: One-shot PR 61 autosave validator repair

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-pr61-autosave-validator-repair.yml"

concurrency:
  group: one-shot-pr61-autosave-validator-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/inkspan' &&
      github.actor == 'seonghobae' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'docs/autosave-product-discovery'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v4.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply, test, and materialize exact-head repair
        shell: bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 -I - <<'PY'
          from pathlib import Path


          def replace_exact(path: Path, old: str, new: str) -> None:
              """Replace one exact documentation contract or fail without ambiguity."""

              content = path.read_text(encoding="utf-8")
              if content.count(old) != 1:
                  raise SystemExit(f"{path}: expected one exact repair target")
              path.write_text(content.replace(old, new, 1), encoding="utf-8")


          readme = Path("README.md")
          replace_exact(
              readme,
              "let durableStrongEntityTag = loadedRevision.strongEntityTag;",
              "// This value comes from the durable service's ETag response header.\n"
              "// Inkspan's local revision digest is not a durable HTTP validator.\n"
              "let durableStrongEntityTag = loadedStrongEntityTag;",
          )
          replace_exact(
              readme,
              "    durableStrongEntityTag = evidence.revision.strongEntityTag;\n"
              "    return { status: 'saved' };",
              "    const nextDurableStrongEntityTag = response.headers.get('ETag');\n"
              "    const isQuotedOpaqueTag =\n"
              "      nextDurableStrongEntityTag !== null &&\n"
              "      /^\"[\\u0021\\u0023-\\u007e\\u0080-\\u00ff]*\"$/.test(\n"
              "        nextDurableStrongEntityTag,\n"
              "      );\n"
              "    if (\n"
              "      nextDurableStrongEntityTag === null ||\n"
              "      nextDurableStrongEntityTag.startsWith('W/') ||\n"
              "      !isQuotedOpaqueTag\n"
              "    ) {\n"
              "      throw new Error('Durable save response omitted a strong ETag');\n"
              "    }\n\n"
              "    durableStrongEntityTag = nextDurableStrongEntityTag;\n"
              "    return { status: 'saved' };",
          )
          replace_exact(
              readme,
              "Use the framework-independent autosave subpath when a host needs deterministic,\n"
              "bounded local ordering around its own durable document service:\n",
              "Use the framework-independent autosave subpath when a host needs deterministic,\n"
              "bounded local ordering around its own durable document service. The initial\n"
              "`loadedStrongEntityTag` and every replacement value must be a server-selected\n"
              "strong `ETag` for the durable representation, never Inkspan's local content\n"
              "revision digest:\n",
          )
          replace_exact(
              readme,
              "Inkspan owns immutable evidence validation, one-active/one-pending local\n"
              "coordination, deterministic outcomes, and redacted queue failures. The host owns\n",
              "Inkspan owns immutable evidence validation, one-active/one-pending local\n"
              "coordination, deterministic outcomes, and redacted queue failures. A successful\n"
              "write advances the next `If-Match` value only from the durable service's returned\n"
              "strong `ETag`; a missing, weak, or malformed validator fails closed. The host owns\n",
          )

          doctoring = Path("docs/doctoring/autosave-product-discovery.md")
          replace_exact(
              doctoring,
              "- one copyable autosave example demonstrates the public import, immutable\n"
              "  revision evidence, explicit initial durable revision, and host save callback;\n",
              "- one copyable autosave example demonstrates the public import, immutable\n"
              "  revision evidence, a server-selected opaque validator, and the host save\n"
              "  callback;\n"
              "- successful writes advance durable `If-Match` state only from a returned strong\n"
              "  `ETag`; local Inkspan revision evidence is never substituted for that server\n"
              "  validator;\n",
          )
          replace_exact(
              doctoring,
              "Hosts remain responsible for authenticated durable RFC\n"
              "9110 `If-Match` enforcement and all service-side policy.\n",
              "Hosts remain responsible for authenticated durable RFC\n"
              "9110 `If-Match` enforcement, issuing a server-selected opaque validator for each\n"
              "accepted durable representation, and all service-side policy.\n",
          )
          replace_exact(
              doctoring,
              "- the README contains the copyable autosave import and explicit durable-host\n"
              "  boundary;\n",
              "- the README contains the copyable autosave import, explicit durable-host\n"
              "  boundary, and fail-closed strong-`ETag` refresh after every accepted write;\n",
          )
          replace_exact(
              doctoring,
              "## References\n\n",
              "## References\n\n"
              "Fielding, R., Nottingham, M., & Reschke, J. (2022). *HTTP semantics*\n"
              "(RFC 9110). Internet Engineering Task Force.\n"
              "https://www.rfc-editor.org/rfc/rfc9110\n\n",
          )

          Path(".github/workflows/one-shot-pr61-autosave-validator-repair.yml").unlink()
          PY

          pnpm vitest run src/packageDiscovery.test.ts
          pnpm typecheck
          git diff --check
          test ! -e .github/workflows/one-shot-pr61-autosave-validator-repair.yml

          base_tree="$(
            gh api -X GET "repos/${GITHUB_REPOSITORY}/git/commits/${EXPECTED_HEAD}" \
              --jq '.tree.sha'
          )"
          readme_blob="$(
            jq -Rs '{content: ., encoding: "utf-8"}' <README.md \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq '.sha'
          )"
          doctoring_blob="$(
            jq -Rs '{content: ., encoding: "utf-8"}' \
              <docs/doctoring/autosave-product-discovery.md \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/blobs" \
                  --input - --jq '.sha'
          )"
          tree_sha="$(
            jq -n \
              --arg base_tree "$base_tree" \
              --arg readme_blob "$readme_blob" \
              --arg doctoring_blob "$doctoring_blob" \
              '{
                base_tree: $base_tree,
                tree: [
                  {
                    path: "README.md",
                    mode: "100644",
                    type: "blob",
                    sha: $readme_blob
                  },
                  {
                    path: "docs/doctoring/autosave-product-discovery.md",
                    mode: "100644",
                    type: "blob",
                    sha: $doctoring_blob
                  },
                  {
                    path: ".github/workflows/one-shot-pr61-autosave-validator-repair.yml",
                    mode: "100644",
                    type: "blob",
                    sha: null
                  }
                ]
              }' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/trees" \
                  --input - --jq '.sha'
          )"
          commit_sha="$(
            jq -n \
              --arg message "fix(docs): use server-selected autosave validators" \
              --arg tree "$tree_sha" \
              --arg parent "$EXPECTED_HEAD" \
              '{message: $message, tree: $tree, parents: [$parent]}' \
              | gh api -X POST "repos/${GITHUB_REPOSITORY}/git/commits" \
                  --input - --jq '.sha'
          )"
          test -n "$commit_sha"
          echo "AUTOSAVE_VALIDATOR_REPAIR_COMMIT_SHA=$commit_sha"
