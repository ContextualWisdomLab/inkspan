name: Collaborative Diagnostics Test Fix Once

on:
  push:
    branches:
      - feat/writing-diagnostics-collaboration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collaborative-diagnostics-test-fix-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  correct-overlap-assertion:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Correct overlapping decoration assertion and include boundary suite
        run: |
          python <<'PY'
          from pathlib import Path

          test_path = Path('src/collaboration/CollaborativeCwlEditor.writingDiagnostics.test.tsx')
          source = test_path.read_text(encoding='utf-8')
          obsolete = "    expect(document.querySelectorAll('.cwl-writing-diagnostic')).toHaveLength(2);\n"
          if source.count(obsolete) != 1:
              raise SystemExit('overlap assertion anchor changed')
          source = source.replace(obsolete, '', 1)
          test_path.write_text(source, encoding='utf-8')

          workflow_path = Path('.github/workflows/writing-diagnostics-collaboration-tdd.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          anchor = "          src/collaboration/CollaborativeCwlEditor.writingDiagnostics.coverage.test.tsx\n"
          addition = anchor + "          src/collaboration/CollaborativeCwlEditor.writingDiagnostics.boundary.test.tsx\n"
          if workflow.count(anchor) != 1:
              raise SystemExit('collaboration workflow test anchor changed')
          if 'CollaborativeCwlEditor.writingDiagnostics.boundary.test.tsx' not in workflow:
              workflow = workflow.replace(anchor, addition, 1)
          workflow_path.write_text(workflow, encoding='utf-8')
          PY
      - name: Verify corrected focused collaborative suite
        run: |
          pnpm exec vitest run \
            src/collaboration/CollaborativeCwlEditor.writingDiagnostics.test.tsx \
            src/collaboration/CollaborativeCwlEditor.writingDiagnostics.race.test.tsx \
            src/collaboration/CollaborativeCwlEditor.writingDiagnostics.coverage.test.tsx \
            src/collaboration/CollaborativeCwlEditor.writingDiagnostics.boundary.test.tsx \
            --pool=forks --maxWorkers=1
          pnpm typecheck
      - name: Publish correction and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-collaboration
        run: |
          set -euo pipefail
          rm .github/workflows/collaborative-diagnostics-test-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/collaboration/CollaborativeCwlEditor.writingDiagnostics.test.tsx \
            .github/workflows/writing-diagnostics-collaboration-tdd.yml \
            .github/workflows/collaborative-diagnostics-test-fix-once.yml
          git diff --cached --check
          git commit -m 'test(diagnostics): scope collaborative overlap evidence'
          git push origin "HEAD:${TARGET_BRANCH}"
