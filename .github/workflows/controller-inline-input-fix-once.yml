name: Controller Inline Input Fix Once

on:
  push:
    branches:
      - feat/writing-diagnostics-controller
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controller-inline-input-fix-once-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-inline-input-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove raw input identity from the detached equality gate
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/components/useWritingDiagnosticsController.ts')
          source = path.read_text(encoding='utf-8')
          old = """    previous.kind !== next.kind ||
              previous.rawInput !== next.rawInput ||
              previous.editor !== next.editor ||
          """
          new = """    previous.kind !== next.kind ||
              previous.editor !== next.editor ||
          """
          if source.count(old) != 1:
              raise SystemExit('expected exactly one raw-input identity gate')
          path.write_text(source.replace(old, new), encoding='utf-8')
          PY
      - name: Verify inline values, defensive boundaries, and public types
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/components/useWritingDiagnosticsController.test.tsx \
            src/components/useWritingDiagnosticsController.actions.test.tsx \
            src/components/useWritingDiagnosticsController.boundary.test.tsx \
            src/components/useWritingDiagnosticsController.coverage.test.tsx \
            --pool=forks \
            --maxWorkers=1
          pnpm typecheck
      - name: Publish the validated source repair and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-controller
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/useWritingDiagnosticsController.ts
          git rm .github/workflows/controller-inline-input-fix-once.yml
          git diff --cached --check
          git commit -m 'fix(diagnostics): stabilize inline controller inputs'
          git push origin "HEAD:${TARGET_BRANCH}"
