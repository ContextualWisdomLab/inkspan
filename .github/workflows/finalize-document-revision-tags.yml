name: Finalize document revision tags

on:
  push:
    branches: [feat/document-revision-tags]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-document-revision-tags
  cancel-in-progress: false

jobs:
  validate-and-finalize:
    if: github.repository == 'ContextualWisdomLab/inkspan' && github.ref == 'refs/heads/feat/document-revision-tags'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/document-revision-tags
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Add the 0.5.22 changelog entry
        shell: python
        run: |
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          section = '''
          ## [0.5.22] — 2026-08-04

          ### Added
          - `createDocumentEnvelopeRevision()` and `createDocumentEnvelopeRevisionBytes()` for deterministic SHA-256 validators over RFC 8785 canonical envelope bytes
          - Frozen `CwlEditorDocumentRevision`, injectable `DocumentEnvelopeDigestProvider`, and redacted `DocumentEnvelopeRevisionError` public contracts
          - `CwlEditorHandle.getDocumentEnvelopeRevision()` for one-call revision generation from the current standalone or collaborative editor state

          ### Changed
          - Package version **0.5.22**
          - Object, JSON-text, byte, and imperative revision paths normalize supported envelopes to one canonical UTF-8 representation before hashing

          ### Reliability
          - Equivalent envelopes produce the same lowercase digest and quoted strong entity tag despite object-property order or insignificant JSON whitespace
          - The implementation fails closed when Web Cryptography is unavailable, an injected digest operation fails, or a provider returns anything other than a 32-byte SHA-256 result

          ### Security
          - Inkspan never falls back to SHA-1 or a non-cryptographic checksum; digest errors remain redacted and source document content is not copied into diagnostics
          - Revision tags are equality validators, not signatures, authorization tokens, tenant identifiers, or proof of persistence; CWL and naruon hosts retain atomic server-side `If-Match`, access control, signing, encryption, audit, and conflict policy

          ### Tests
          - Added canonical-byte, noncanonical-input, platform-provider, injected-provider, unavailable-provider, rejected-provider, invalid-result, lifecycle, imperative-handle, ESM, CommonJS, and repository-wide 100% coverage verification

          ### Documentation
          - Added `docs/document-revision-tags.md` with RFC 9110 strong-validator usage, Web Cryptography behavior, privacy boundaries, and optimistic-concurrency ownership
          - Expanded `docs/imperative-envelope-persistence.md` with revision export and server-side compare-and-swap guidance

          '''
          if '## [0.5.22]' not in text:
              if marker not in text:
                  raise SystemExit('CHANGELOG Unreleased marker is missing')
              text = text.replace(marker, marker + '\n' + section, 1)
              path.write_text(text, encoding='utf-8')
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with 100% coverage
        run: pnpm coverage
      - name: Build library
        run: pnpm build
      - name: Verify packed package consumers
        run: pnpm verify:package
      - name: Build demo
        run: pnpm build:demo
      - name: Commit validated changelog and remove bootstrap workflow
        env:
          EXPECTED_BRANCH: feat/document-revision-tags
        run: |
          test "${GITHUB_REF_NAME}" = "${EXPECTED_BRANCH}"
          git rm .github/workflows/finalize-document-revision-tags.yml
          git add CHANGELOG.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: finalize Inkspan 0.5.22 revision tags'
          git push origin HEAD:${EXPECTED_BRANCH}
