name: Patch raster image policy docs

on:
  push:
    branches: [fix/enforce-inline-image-sources]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/enforce-inline-image-sources
      - name: Clarify supported raster formats
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old = '''  inline base64 data URIs. External, protocol-relative, blob, file, JavaScript,
            malformed, and oversized sources are rejected before rendering; authors can add
          '''
          new = '''  inline base64 raster data URIs. External, protocol-relative, blob, file,
            JavaScript, SVG/active-vector, unsupported-MIME, malformed, and oversized sources
            are rejected before rendering; authors can add
          '''
          if old not in readme:
              raise SystemExit('missing capability policy anchor')
          readme = readme.replace(old, new, 1)

          old = '''`setValue`, `insertValue`, pasted HTML, and direct TipTap transactions. Only strict
          `data:image/...;base64,...` sources within `image.maxSizeBytes` survive into editor
          state or serialized HTML. Rejections reach the host through `onImageError` as
          '''
          new = '''`setValue`, `insertValue`, pasted HTML, and direct TipTap transactions. Only strict
          base64 raster sources (`png`, `jpeg`/`jpg`, `gif`, `webp`, `avif`, `apng`, `bmp`,
          and ICO) within `image.maxSizeBytes` survive into editor state or serialized HTML.
          SVG is intentionally rejected before decoder use because active/vector payloads can
          reference external resources. Rejections reach the host through `onImageError` as
          '''
          if old not in readme:
              raise SystemExit('missing detailed source policy anchor')
          readme_path.write_text(readme.replace(old, new, 1))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          old = '- External, protocol-relative, `blob:`, `file:`, JavaScript, malformed, empty, and oversized image sources are rejected before they can enter editor state or emit a network-capable `<img>`\n'
          new = '- External, protocol-relative, `blob:`, `file:`, JavaScript, SVG/active-vector, unsupported-MIME, malformed, empty, and oversized image sources are rejected before decoder use, editor-state entry, or emission of a network-capable `<img>`\n'
          if old not in changelog:
              raise SystemExit('missing changelog source policy anchor')
          changelog_path.write_text(changelog.replace(old, new, 1))
          PY
      - name: Commit docs and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md CHANGELOG.md
          git rm .github/workflows/patch-raster-policy-docs.yml
          git commit -m "docs: define the supported raster image policy"
          git push origin HEAD:fix/enforce-inline-image-sources
