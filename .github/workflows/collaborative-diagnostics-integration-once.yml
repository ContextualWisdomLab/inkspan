name: Collaborative Diagnostics Integration Once

on:
  push:
    branches:
      - feat/writing-diagnostics-collaboration
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collaborative-diagnostics-integration-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-collaborative-diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate writing diagnostics into collaborative editor
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} anchor count was {count}')
              return source.replace(old, new, 1)

          path = Path('src/collaboration/CollaborativeCwlEditor.tsx')
          source = path.read_text(encoding='utf-8')

          old = """import { useEditorHandle } from '../components/useEditorHandle.js';
          import { useLatestRef } from '../components/useLatestRef.js';
          """
          new = """import { useEditorHandle } from '../components/useEditorHandle.js';
          import { useLatestRef } from '../components/useLatestRef.js';
          import { useWritingDiagnosticsController } from '../components/useWritingDiagnosticsController.js';
          import { WritingDiagnosticsPanel } from '../components/WritingDiagnosticsPanel.js';
          """
          source = replace_once(source, old, new, 'diagnostic imports')

          old = """    ariaInvalid,
              ariaRequired,
            } = props;
          """
          new = """    ariaInvalid,
              ariaRequired,
              writingDiagnostics,
              onWritingDiagnosticAction,
              onWritingDiagnosticsError,
              writingDiagnosticsLabel,
              printWritingDiagnostics,
            } = props;
          """
          source = replace_once(source, old, new, 'diagnostic props')

          old = """  useEditorHandle(ref, editor, modeRef);
          
            useEffect(() => {
          """
          new = """  const writingDiagnosticsController = useWritingDiagnosticsController({
              editor,
              diagnostics: writingDiagnostics,
              onAction: onWritingDiagnosticAction,
              onError: onWritingDiagnosticsError,
            });
          
            useEditorHandle(ref, editor, modeRef, writingDiagnosticsController);
          
            useEffect(() => {
          """
          source = replace_once(source, old, new, 'controller and handle')

          old = """      onFormReset={editor && onFormReset ? handleFormReset : undefined}
                status={status}
              />
          """
          new = """      onFormReset={editor && onFormReset ? handleFormReset : undefined}
                status={status}
                writingDiagnosticsPanel={
                  writingDiagnostics === undefined ? undefined : (
                    <WritingDiagnosticsPanel
                      controller={writingDiagnosticsController}
                      label={writingDiagnosticsLabel ?? 'Writing guidance'}
                      onApplyDiagnostic={
                        editable
                          ? (diagnosticId) => {
                              void writingDiagnosticsController.applyDiagnostic(
                                diagnosticId,
                              );
                            }
                          : undefined
                      }
                      printEnabled={printWritingDiagnostics}
                    />
                  )
                }
              />
          """
          source = replace_once(source, old, new, 'diagnostic panel')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify collaborative diagnostic integration
        run: |
          pnpm exec vitest run \
            src/collaboration/CollaborativeCwlEditor.writingDiagnostics.test.tsx \
            --pool=forks --maxWorkers=1
          pnpm typecheck
      - name: Publish validated integration and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-collaboration
        run: |
          set -euo pipefail
          rm .github/workflows/collaborative-diagnostics-integration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/collaboration/CollaborativeCwlEditor.tsx \
            .github/workflows/collaborative-diagnostics-integration-once.yml
          git diff --cached --check
          git commit -m 'feat(diagnostics): integrate collaborative guidance'
          git push origin "HEAD:${TARGET_BRANCH}"
