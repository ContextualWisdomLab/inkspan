name: Patch inline image policy docs

on:
  push:
    branches: [fix/enforce-inline-image-sources]

permissions:
  contents: write

concurrency:
  group: patch-inline-image-docs
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/enforce-inline-image-sources
      - name: Document the strict inline image boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          old = '''- **Self-contained, accessible images** — paste, drop, or upload images as
            inline base64 data URIs, then author meaningful alternative text or explicitly
            mark decorative images. Configurable limits keep documents portable and LLM-ready.
          '''
          new = '''- **Self-contained, accessible images** — every editor image must be an inline
            base64 data URI. External, protocol-relative, blob, file, JavaScript, malformed,
            and oversized sources are rejected before rendering; authors can add meaningful
            alternative text or explicitly mark decorative images.
          '''
          if old not in text:
              raise SystemExit('missing image capability anchor')
          text = text.replace(old, new, 1)

          old = '''When an image is selected, the **Alt** action prefills its current replacement
          text. Enter a meaningful description for informative images, or leave the value
          empty to produce an explicit `alt=""` for decorative images. Upload, paste, and
          drop start with that explicit decorative default instead of omitting `alt`.
          Toolbar active and disabled states follow editor transactions and selection
          updates.
          '''
          new = '''When an image is selected, the **Alt** action prefills its current replacement
          text. Enter a meaningful description for informative images, or leave the value
          empty to produce an explicit `alt=""` for decorative images. Upload, paste, and
          drop start with that explicit decorative default instead of omitting `alt`.

          Inkspan enforces the same source policy on initial HTML/Markdown, controlled values,
          `setValue`, `insertValue`, pasted HTML, and direct TipTap transactions. Only strict
          `data:image/...;base64,...` sources within `image.maxSizeBytes` survive into editor
          state or serialized HTML. Rejections reach the host through `onImageError` as
          `Base64ImageSourceError` or `Base64SizeError`; malformed state supplied outside the
          supported API renders as an inert marker rather than a network-capable `<img>`.
          Toolbar active and disabled states follow editor transactions and selection
          updates.
          '''
          if old not in text:
              raise SystemExit('missing image workflow anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit README and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git rm .github/workflows/patch-inline-image-docs.yml
          git commit -m "docs: define the inline image security boundary"
          git push origin HEAD:fix/enforce-inline-image-sources
