name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ContextualWisdomLab/inkspan'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      NODE_VERSION: '22'
      PYTHON_VERSION: '3.14'
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: office/requirements-ci.txt
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const packageMetadata = JSON.parse(readFileSync('package.json', 'utf8'));
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const releaseTag = process.env.RELEASE_TAG;
          const expectedTag = `v${packageMetadata.version}`;
          const repositoryUrl = 'git+https://github.com/ContextualWisdomLab/inkspan.git';

          if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(releaseTag)) {
            throw new Error(`Release tag is not valid semantic version syntax: ${releaseTag}`);
          }
          if (releaseTag !== expectedTag) {
            throw new Error(`Release tag ${releaseTag} does not match package version ${expectedTag}`);
          }
          if (!changelog.includes(`## [${packageMetadata.version}]`)) {
            throw new Error(`CHANGELOG.md has no release section for ${packageMetadata.version}`);
          }
          if (packageMetadata.repository?.url !== repositoryUrl) {
            throw new Error('package.json repository URL must identify the canonical public repository');
          }
          NODE
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck JavaScript package
        run: pnpm typecheck
      - name: Test JavaScript package with 100% coverage
        run: pnpm coverage
      - name: Build JavaScript package
        run: pnpm build
      - name: Verify packed package consumers
        run: pnpm verify:package
      - name: Build demo
        run: pnpm build:demo
      - name: Pack npm distribution
        run: |
          mkdir -p release
          package_file="$({ npm pack --ignore-scripts --json; } | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].filename));")"
          mv "$package_file" release/
      - name: Install hash-locked Office dependencies
        working-directory: office
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: Verify Office dependency consistency
        working-directory: office
        run: python -m pip check
      - name: Verify Office docstring coverage
        working-directory: office
        run: python scripts/check_docstrings.py
      - name: Test Office package with 100% branch coverage
        working-directory: office
        env:
          PYTHONPATH: src
        run: |
          coverage run -m pytest
          coverage report
      - name: Build Office wheel
        working-directory: office
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          mv dist/*.whl ../release/
      - name: Generate release checksums
        run: |
          cd release
          sha256sum -- *.tgz *.whl > SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            release/*.tgz
            release/*.whl
            release/SHA256SUMS
      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in release/*.tgz release/*.whl release/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish or refresh GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* \
              --verify-tag \
              --generate-notes \
              --title "Inkspan ${GITHUB_REF_NAME#v}"
          fi
