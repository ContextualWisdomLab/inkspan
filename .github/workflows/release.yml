name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.14'

jobs:
  build-release-artifacts:
    if: github.repository == 'ContextualWisdomLab/inkspan'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: office/requirements-ci.txt
      - name: Verify release identity and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { readFileSync } = require('node:fs');

          const packageMetadata = JSON.parse(readFileSync('package.json', 'utf8'));
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const releaseTag = process.env.RELEASE_TAG;
          const expectedTag = `v${packageMetadata.version}`;
          const repositoryUrl = 'git+https://github.com/ContextualWisdomLab/inkspan.git';

          if (!/^v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$/.test(releaseTag)) {
            throw new Error(`Release tag is not valid semantic version syntax: ${releaseTag}`);
          }
          if (releaseTag !== expectedTag) {
            throw new Error(`Release tag ${releaseTag} does not match package version ${expectedTag}`);
          }
          if (!changelog.includes(`## [${packageMetadata.version}]`)) {
            throw new Error(`CHANGELOG.md has no release section for ${packageMetadata.version}`);
          }
          if (packageMetadata.repository?.url !== repositoryUrl) {
            throw new Error('package.json repository URL must identify the canonical public repository');
          }
          NODE
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Release tags must point to a commit already reachable from main."
            exit 1
          fi
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck JavaScript package
        run: pnpm typecheck
      - name: Test JavaScript package with 100% coverage
        run: pnpm coverage
      - name: Build JavaScript package
        run: pnpm build
      - name: Verify packed package consumers
        run: pnpm verify:package
      - name: Build demo
        run: pnpm build:demo
      - name: Pack npm distribution
        run: |
          set -euo pipefail
          mkdir -p release
          package_file="$({ npm pack --ignore-scripts --json; } | node -e "let input=''; process.stdin.on('data', chunk => input += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(input)[0].filename));")"
          mv "$package_file" release/
      - name: Install hash-locked Office dependencies
        working-directory: office
        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: Verify Office dependency consistency
        working-directory: office
        run: python -m pip check
      - name: Verify Office docstring coverage
        working-directory: office
        run: python scripts/check_docstrings.py
      - name: Test Office package with 100% branch coverage
        working-directory: office
        env:
          PYTHONPATH: src
        run: |
          coverage run -m pytest
          coverage report
      - name: Build and inspect Office wheel
        working-directory: office
        run: |
          set -euo pipefail
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path('dist').glob('*.whl'))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert 'inkspan_office/schema.json' in names
          assert any(name.endswith('.dist-info/licenses/LICENSE') for name in names)
          PY
          mv dist/*.whl ../release/
      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum -- *.tgz *.whl > SHA256SUMS
      - name: Transfer exact release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkspan-release-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-release:
    if: github.repository == 'ContextualWisdomLab/inkspan'
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: inkspan-release-${{ github.ref_name }}
          path: release
      - name: Verify transferred checksums
        run: |
          set -euo pipefail
          cd release
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            release/*.tgz
            release/*.whl
            release/SHA256SUMS
      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in release/*.tgz release/*.whl release/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_state="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft \
            --jq '.isDraft' 2>/dev/null || true)"

          if [[ "$release_state" == 'false' ]]; then
            echo "::error::A published release already exists; refusing to replace its assets."
            exit 1
          fi
          if [[ -z "$release_state" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "Inkspan ${GITHUB_REF_NAME#v}"
          fi

          gh release upload "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false

          release_immutable="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json isImmutable \
            --jq '.isImmutable')"
          if [[ "$release_immutable" != 'true' ]]; then
            if ! gh release delete "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --yes; then
              echo "::error::The mutable release could not be rolled back automatically."
            fi
            echo "::error::Repository release immutability is not enabled; the mutable release was rejected."
            exit 1
          fi

          gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          for artifact in release/*.tgz release/*.whl release/SHA256SUMS; do
            gh release verify-asset "$GITHUB_REF_NAME" "$artifact" \
              --repo "$GITHUB_REPOSITORY"
          done
