name: Writing Diagnostics UI TDD

on:
  push:
    branches:
      - feat/writing-diagnostics-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: writing-diagnostics-ui-tdd-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  focused-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect accessible writing-guidance coverage
        id: focused_coverage
        continue-on-error: true
        run: >-
          pnpm exec vitest run
          src/components/WritingDiagnosticsPanel.test.tsx
          src/components/WritingDiagnosticsPanel.keyboard.test.tsx
          src/components/WritingDiagnosticsPanel.print.test.tsx
          src/components/EditorFrame.test.tsx
          src/printStyles.test.ts
          --pool=forks
          --maxWorkers=1
          --coverage
          --coverage.include=src/components/WritingDiagnosticsPanel.tsx
          --coverage.reporter=text
          --coverage.reporter=json
      - name: Report and enforce exact UI coverage
        run: |
          node <<'NODE'
          const { existsSync, readFileSync } = require('node:fs');
          if (!existsSync('coverage/coverage-final.json')) {
            console.error('::error file=coverage/coverage-final.json,line=1::Focused coverage report is missing.');
            process.exit(1);
          }
          const coverage = JSON.parse(readFileSync('coverage/coverage-final.json', 'utf8'));
          const suffix = '/src/components/WritingDiagnosticsPanel.tsx';
          const displayPath = suffix.slice(1);
          const entry = Object.entries(coverage).find(([path]) => path.endsWith(suffix));
          let failed = process.env.FOCUSED_COVERAGE_OUTCOME !== 'success';
          if (!entry) {
            console.error(`::error file=${displayPath},line=1::Focused coverage record is missing.`);
            process.exit(1);
          }
          const [, fileCoverage] = entry;
          const missingStatementLines = [...new Set(
            Object.entries(fileCoverage.s)
              .filter(([, count]) => count === 0)
              .map(([id]) => fileCoverage.statementMap[id].start.line),
          )].sort((left, right) => left - right);
          const missingFunctionLines = [...new Set(
            Object.entries(fileCoverage.f)
              .filter(([, count]) => count === 0)
              .map(([id]) => fileCoverage.fnMap[id].decl.start.line),
          )].sort((left, right) => left - right);
          const missingBranches = [];
          for (const [id, counts] of Object.entries(fileCoverage.b)) {
            counts.forEach((count, index) => {
              if (count !== 0) return;
              const branch = fileCoverage.branchMap[id];
              const location = branch.locations?.[index] ?? branch.loc;
              missingBranches.push(`${location.start.line}:${index}`);
            });
          }
          const statementTotal = Object.keys(fileCoverage.s).length;
          const statementCovered = Object.values(fileCoverage.s).filter((count) => count > 0).length;
          const functionTotal = Object.keys(fileCoverage.f).length;
          const functionCovered = Object.values(fileCoverage.f).filter((count) => count > 0).length;
          const branchCounts = Object.values(fileCoverage.b).flat();
          const branchTotal = branchCounts.length;
          const branchCovered = branchCounts.filter((count) => count > 0).length;
          console.log(
            `::notice file=${displayPath},line=1::Statements ${statementCovered}/${statementTotal}; ` +
            `functions ${functionCovered}/${functionTotal}; branches ${branchCovered}/${branchTotal}.`,
          );
          if (missingStatementLines.length || missingFunctionLines.length || missingBranches.length) {
            console.error(
              `::error file=${displayPath},line=1::` +
              `Missing statement lines: ${missingStatementLines.join(', ') || 'none'}; ` +
              `missing function lines: ${missingFunctionLines.join(', ') || 'none'}; ` +
              `missing branches line:index: ${missingBranches.join(', ') || 'none'}.`,
            );
            failed = true;
          }
          if (failed) process.exit(1);
          NODE
        env:
          FOCUSED_COVERAGE_OUTCOME: ${{ steps.focused_coverage.outcome }}
      - name: Typecheck writing-guidance contracts
        run: pnpm typecheck
      - name: Run complete production coverage gate
        run: pnpm coverage
      - name: Build every package entrypoint
        run: pnpm build
      - name: Verify packed-package consumers
        run: pnpm verify:package
      - name: Build the demonstration application
        run: pnpm build:demo
