name: Repair preparse envelope integration once

on:
  pull_request:
    types: [synchronize]
    paths:
      - .github/workflows/repair-preparse-envelope-limits.yml

permissions:
  contents: write

concurrency:
  group: repair-preparse-envelope-integration
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.repository == 'ContextualWisdomLab/inkspan' &&
      github.event.pull_request.head.ref == 'security/preparse-envelope-limits'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/preparse-envelope-limits
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Apply release slice and validate all TypeScript gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          envelope_path = Path('src/documentEnvelope.ts')
          envelope_source = envelope_path.read_text(encoding='utf-8')
          old_import = "import { containsDuplicateJsonObjectNames } from './jsonObjectNameScanner.js';"
          if old_import not in envelope_source:
              raise SystemExit('Expected scanner import is missing')
          envelope_source = envelope_source.replace(
              old_import,
              "import { inspectJsonText } from './jsonObjectNameScanner.js';",
              1,
          )
          start_marker = '    if (containsDuplicateJsonObjectNames(source)) {'
          end_marker = '    try {'
          start_index = envelope_source.find(start_marker)
          end_index = envelope_source.find(end_marker, start_index)
          if start_index < 0 or end_index < 0:
              raise SystemExit('Expected duplicate-name parser block is missing')
          replacement = """    const inspection = inspectJsonText(source, {
              maxValues: Math.min(
                Number.MAX_SAFE_INTEGER,
                resolvedLimits.maxJsonValues + 3,
              ),
              maxDepth: Math.min(
                Number.MAX_SAFE_INTEGER,
                resolvedLimits.maxNestingDepth + 1,
              ),
            });
            if (inspection === 'duplicate-object-name') {
              throw new DocumentEnvelopeError(
                'Document envelope JSON must not contain duplicate object names',
              );
            }
            if (inspection === 'value-count-limit') {
              throw new DocumentEnvelopeError(
                'Document envelope exceeds the supported JSON value count',
              );
            }
            if (inspection === 'nesting-depth-limit') {
              throw new DocumentEnvelopeError(
                'Document envelope exceeds the supported document nesting depth',
              );
            }
          """
          envelope_source = (
              envelope_source[:start_index]
              + replacement
              + envelope_source[end_index:]
          )
          envelope_path.write_text(envelope_source, encoding='utf-8')

          scanner_test_path = Path('src/jsonObjectNameScanner.test.ts')
          scanner_tests = scanner_test_path.read_text(encoding='utf-8')
          scanner_tests = scanner_tests.replace(
              'inspectJsonText(source, { maxValues: 6, maxDepth: 3 })',
              'inspectJsonText(source, { maxValues: 5, maxDepth: 3 })',
              1,
          )
          scanner_test_path.write_text(scanner_tests, encoding='utf-8')

          limit_test_path = Path('src/documentEnvelopeLimits.test.ts')
          limit_tests = limit_test_path.read_text(encoding='utf-8')
          limit_marker = "  it('rejects object and array expansion past the JSON-value ceiling', () => {\n"
          integration_test = """  it('enforces structural ceilings before materializing raw JSON text', () => {
            const source = JSON.stringify({
              schemaId: DOCUMENT_ENVELOPE_SCHEMA_ID,
              schemaVersion: DOCUMENT_ENVELOPE_SCHEMA_VERSION,
              documentJson: {
                type: 'doc',
                content: [{ type: 'paragraph' }],
              },
            });

            expect(() =>
              parseDocumentEnvelope(source, { maxJsonValues: 2 }),
            ).toThrow('JSON value count');
            expect(() =>
              parseDocumentEnvelope(source, { maxNestingDepth: 1 }),
            ).toThrow('nesting depth');
          });

          """
          if 'enforces structural ceilings before materializing raw JSON text' not in limit_tests:
              if limit_marker not in limit_tests:
                  raise SystemExit('Expected limit-test insertion marker is missing')
              limit_tests = limit_tests.replace(
                  limit_marker,
                  integration_test + limit_marker,
                  1,
              )
              limit_test_path.write_text(limit_tests, encoding='utf-8')

          package_path = Path('package.json')
          package_text = package_path.read_text(encoding='utf-8')
          package_text = package_text.replace('"version": "0.5.18"', '"version": "0.5.19"', 1)
          package_text = package_text.replace(
              'resource-bounded duplicate-name-safe versioned persistence envelopes',
              'preparse-resource-bounded duplicate-name-safe versioned persistence envelopes',
              1,
          )
          package_path.write_text(package_text, encoding='utf-8')

          docs_path = Path('docs/document-envelope.md')
          docs = docs_path.read_text(encoding='utf-8')
          old_docs = """The value and array-width checks run before recursively materializing child
          values. Object reflection reads descriptors without invoking getters. Limit
          failures use `DocumentEnvelopeError` and do not include source strings, object
          names, inline image bytes, or tenant identifiers.
          """
          new_docs = """For JSON text and decoded UTF-8 bytes, the iterative duplicate-name scanner also
          counts every scalar and container and tracks value depth before `JSON.parse()`.
          The fixed three-value and one-depth envelope wrapper allowance keeps configured
          limits scoped to `documentJson`. Oversized raw structures therefore fail before
          the native parser allocates their complete object graph. Syntax-invalid input
          that remains inside the ceilings is still reported by the canonical parser.

          The post-parse value and array-width checks remain as defense in depth before
          recursively cloning child values. Object reflection reads descriptors without
          invoking getters. Limit failures use `DocumentEnvelopeError` and do not include
          source strings, object names, inline image bytes, or tenant identifiers.
          """
          if old_docs not in docs:
              raise SystemExit('Expected documentation replacement marker is missing')
          docs_path.write_text(docs.replace(old_docs, new_docs, 1), encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          release = '''## [0.5.19] — 2026-08-04

          ### Changed
          - Package version **0.5.19**
          - Raw JSON text and decoded UTF-8 envelopes now enforce configured value-count and nesting ceilings with an explicit stack before native `JSON.parse()` materializes the object graph
          - The scanner reserves the fixed envelope wrapper allowance so `maxJsonValues` and `maxNestingDepth` continue to describe `documentJson`

          ### Security
          - Pathological wide or deep JSON fails before full native-parser allocation while post-parse cloning retains the same limits as defense in depth
          - Duplicate-name rejection, malformed-JSON handling, redacted errors, strict UTF-8 decoding, and CWL/naruon transport and tenant boundaries remain unchanged

          ### Tests
          - Added exact-limit, raw value-count, scalar/container depth, duplicate, malformed, and parser-integration coverage under the repository-wide 100% TypeScript coverage gate

          ### Documentation
          - Clarified preparse enforcement, fixed wrapper allowances, defense-in-depth cloning, and the distinction between syntax errors and resource-limit rejection

          '''
          if '## [0.5.19]' not in changelog:
              if marker not in changelog:
                  raise SystemExit('CHANGELOG Unreleased marker is missing')
              changelog_path.write_text(
                  changelog.replace(marker, marker + '\n' + release, 1),
                  encoding='utf-8',
              )
          PY
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm coverage
          pnpm build
          pnpm verify:package
          pnpm build:demo
          rm .github/workflows/apply-preparse-envelope-limits.yml
          rm .github/workflows/repair-preparse-envelope-limits.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "security: enforce envelope limits before JSON parsing"
          git push origin HEAD:security/preparse-envelope-limits
