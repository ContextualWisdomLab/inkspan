name: Projection Refactor Once

on:
  push:
    branches:
      - feat/writing-diagnostics-projection
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projection-refactor-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remove-unreachable-field-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Remove the logically unreachable postcondition loop
        id: refactor
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('src/writingDiagnosticProjection.ts')
          source = path.read_text(encoding='utf-8')
          old = """  for (const field of expectedFields) {
              if (!Object.prototype.hasOwnProperty.call(result, field)) {
                throw new WritingDiagnosticProjectionError(errorCode);
              }
            }
            return result;
          }
          """
          new = """  return result;
          }
          """
          if old not in source:
              Path('/tmp/refactor-state').write_text('unchanged', encoding='utf-8')
              raise SystemExit(0)
          if source.count(old) != 1:
              raise SystemExit('unexpected duplicate exact postcondition loop')
          path.write_text(source.replace(old, new), encoding='utf-8')
          Path('/tmp/refactor-state').write_text('changed', encoding='utf-8')
          PY
      - name: Verify focused tests and type safety
        run: |
          pnpm exec vitest run \
            src/writingDiagnosticProjection.test.ts \
            src/writingDiagnosticProjectionBoundary.test.ts \
            src/writingDiagnosticProjectionCoverage.test.ts \
            src/textPositionSelectorEvidenceBoundary.test.ts
          pnpm typecheck
      - name: Commit the source-only refactor
        env:
          TARGET_BRANCH: feat/writing-diagnostics-projection
        run: |
          set -euo pipefail
          if [[ "$(cat /tmp/refactor-state)" == 'unchanged' ]]; then
            echo 'The unreachable loop is already absent.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/writingDiagnosticProjection.ts
          git diff --cached --check
          git commit -m 'refactor(diagnostics): remove unreachable projection postcondition'
          git push origin "HEAD:${TARGET_BRANCH}"
