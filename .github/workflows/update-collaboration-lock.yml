name: Update collaboration lockfile

on:
  push:
    branches: [feat/provider-neutral-collaboration]

permissions:
  contents: write

concurrency:
  group: collaboration-lockfile
  cancel-in-progress: false

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/provider-neutral-collaboration
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Resolve collaboration dependencies
        run: pnpm install --lockfile-only
      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/update-collaboration-lock.yml
          git commit -m "chore: lock collaboration dependencies"
          git push origin HEAD:feat/provider-neutral-collaboration
