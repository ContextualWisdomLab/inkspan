name: Address Writing Diagnostics Review

on:
  push:
    branches:
      - feat/writing-diagnostics-assurance
    paths:
      - .github/workflows/address-writing-diagnostics-review.yml

permissions:
  contents: write

concurrency:
  group: address-writing-diagnostics-review
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/writing-diagnostics-assurance
          fetch-depth: 0
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Correct bounded review-repair anchors
        run: python .github/scripts/fix_review_repair_counter.py
      - name: Apply verified review fixes
        run: python .github/scripts/address_writing_diagnostics_review.py
      - name: Regenerate isolated browser-test lock
        run: >-
          pnpm --dir tests/browser install
          --lockfile-only
          --ignore-scripts
          --no-frozen-lockfile
      - name: Install exact dependency graphs
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir tests/browser install --frozen-lockfile
      - name: Verify isolated React imports
        run: >-
          pnpm --dir tests/browser exec node --input-type=module -e
          "await import('react'); await import('react-dom/client');"
      - name: Run focused assurance and typecheck
        run: |
          pnpm exec vitest run \
            src/components/writingDiagnosticsSecurity.test.tsx \
            src/components/writingDiagnosticsFocus.test.tsx \
            --pool=forks \
            --maxWorkers=1
          pnpm typecheck
      - name: Validate workflow and exact patch scope
        run: |
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/release.yml')"
          git diff --check
          mapfile -t changed_files < <(git diff --name-only | LC_ALL=C sort)
          expected_files=(
            .github/scripts/address_writing_diagnostics_review.py
            .github/workflows/release.yml
            src/components/writingDiagnosticsSecurity.test.tsx
            tests/browser/package.json
            tests/browser/pnpm-lock.yaml
          )
          if ! diff -u \
            <(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort) \
            <(printf '%s\n' "${changed_files[@]}"); then
            echo "::error::Review repair changed an unexpected file."
            exit 1
          fi
      - name: Commit verified review repair and remove one-shot files
        env:
          BRANCH_NAME: feat/writing-diagnostics-assurance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/release.yml \
            src/components/writingDiagnosticsSecurity.test.tsx \
            tests/browser/package.json \
            tests/browser/pnpm-lock.yaml
          git rm -f \
            .github/scripts/address_writing_diagnostics_review.py \
            .github/scripts/fix_review_repair_counter.py \
            .github/workflows/address-writing-diagnostics-review.yml
          git commit -m "fix(diagnostics): address assurance review findings"
          git push origin "HEAD:${BRANCH_NAME}"
