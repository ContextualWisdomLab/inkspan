name: Export image source policy

on:
  push:
    branches: [fix/enforce-inline-image-sources]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: fix/enforce-inline-image-sources
      - name: Export typed image policy APIs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/index.ts')
          text = path.read_text()
          line = "export { Base64ImageSourceError, validateInlineImageSource } from './extensions/Base64Image.js';\n"
          if line not in text:
              text = text.rstrip() + "\n" + line
          path.write_text(text)
          PY
      - name: Commit export and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.ts
          git rm .github/workflows/export-image-source-policy.yml
          git commit -m "feat: export typed image source policy APIs"
          git push origin HEAD:fix/enforce-inline-image-sources
