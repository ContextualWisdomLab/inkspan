name: Finalize changelog spacing

on:
  push:
    branches:
      - feat/conflict-evidence
    paths:
      - .github/workflows/finalize-changelog-spacing.yml

permissions:
  contents: write

concurrency:
  group: finalize-changelog-spacing
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/conflict-evidence
          fetch-depth: 0
      - name: Normalize release section spacing
        shell: python
        run: |
          from pathlib import Path

          changelog_path = Path('CHANGELOG.md')
          content = changelog_path.read_text(encoding='utf-8')
          content = content.replace(
              '## [Unreleased]\n\n\n## [0.5.24]',
              '## [Unreleased]\n\n## [0.5.24]',
              1,
          )
          content = content.replace(
              'durable server compare-and-swap ownership\n## [0.5.23]',
              'durable server compare-and-swap ownership\n\n## [0.5.23]',
              1,
          )
          changelog_path.write_text(content, encoding='utf-8')
          Path('.github/workflows/finalize-changelog-spacing.yml').unlink()
      - name: Commit normalized changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/finalize-changelog-spacing.yml
          git commit -m "docs: normalize Inkspan 0.5.24 changelog spacing"
          git push origin HEAD:feat/conflict-evidence
