name: Repair strict UTF-8 byte branding once

on:
  push:
    branches: [security/strict-envelope-utf8]
    paths:
      - .github/workflows/repair-strict-utf8-brand.yml

permissions:
  contents: write

concurrency:
  group: repair-strict-utf8-byte-branding
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/inkspan'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/strict-envelope-utf8
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Apply brand-safe cross-realm Uint8Array validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/documentEnvelope.ts')
          source = path.read_text(encoding='utf-8')
          constant_marker = "const UTF8_BYTE_ORDER_MARK = 0xefbbbf;\n"
          constant_replacement = """const UTF8_BYTE_ORDER_MARK = 0xefbbbf;
          const TYPED_ARRAY_TAG_GETTER = Object.getOwnPropertyDescriptor(
            Object.getPrototypeOf(Uint8Array.prototype),
            Symbol.toStringTag,
          )!.get!;
          """
          condition = "if (!(source instanceof Uint8Array)) {"
          replacement = "if (!hasUint8ArrayBrand(source)) {"
          helper_marker = "function isPlainObject(value: unknown): value is Record<string, unknown> {\n"
          helper = """function hasUint8ArrayBrand(value: unknown): value is Uint8Array {
            return TYPED_ARRAY_TAG_GETTER.call(value) === 'Uint8Array';
          }

          function isPlainObject(value: unknown): value is Record<string, unknown> {
          """
          if constant_marker not in source or condition not in source or helper_marker not in source:
              raise SystemExit('Expected strict UTF-8 source markers are missing')
          source = source.replace(constant_marker, constant_replacement, 1)
          source = source.replace(condition, replacement, 1)
          source = source.replace(helper_marker, helper, 1)
          path.write_text(source, encoding='utf-8')
          PY
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm vitest run src/documentEnvelopeBytes.test.ts
          rm .github/workflows/repair-strict-utf8-brand.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/documentEnvelope.ts .github/workflows/repair-strict-utf8-brand.yml
          git diff --cached --check
          git commit -m "fix: accept cross-realm Uint8Array envelopes"
          git push origin HEAD:security/strict-envelope-utf8
