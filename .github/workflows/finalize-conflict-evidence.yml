name: Finalize atomic conflict evidence documentation

on:
  push:
    branches:
      - feat/conflict-evidence
    paths:
      - .github/workflows/finalize-conflict-evidence.yml

permissions:
  contents: write

concurrency:
  group: finalize-conflict-evidence
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/conflict-evidence
          fetch-depth: 0

      - name: Finalize release documentation
        shell: python
        run: |
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              Path(path).write_text(content, encoding="utf-8")

          def replace_between(
              path: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
          ) -> None:
              content = read(path)
              start = content.index(start_marker)
              end = content.index(end_marker, start)
              write(path, content[:start] + replacement + content[end:])

          changelog_path = "CHANGELOG.md"
          changelog = read(changelog_path)
          release_heading = "## [0.5.24] — 2026-08-04"
          if release_heading not in changelog:
              marker = "## [Unreleased]\n"
              if marker not in changelog:
                  raise SystemExit("CHANGELOG Unreleased marker is missing")
              release = """

          ## [0.5.24] — 2026-08-04

          ### Added
          - `previousEnvelope` on successful revision-guarded restore results, paired with the exact `previousRevision` derived from that frozen envelope
          - `currentEnvelope` on stable conflict results, paired with the exact non-null `currentRevision` that failed the precondition

          ### Changed
          - Package version **0.5.24**
          - `CwlEditorIfMatchRestoreResult` now encodes stable conflict evidence and moved/destroyed null evidence as separate TypeScript union variants, preventing inconsistent revision-envelope pairs in strict consumers

          ### Reliability
          - Hosts no longer need a second post-conflict editor read that could race with a newer edit and associate the wrong document with a returned revision
          - Document movement, hostile-source reentrancy, and editor destruction return `currentRevision: null` together with `currentEnvelope: null`, requiring a fresh host read before retry
          - Successful restore returns the exact previous envelope and revision beside the applied incoming envelope for compare, merge, fork, audit, and retry workflows

          ### Performance
          - Conflict evidence reuses the frozen current envelope already created before SHA-256 hashing; no second document traversal, clone, canonical serialization, digest, schema reconstruction, or provider call is added

          ### Security
          - Conflict envelopes contain the full client-controlled document body, including text, links, inline image payloads, alternative text, and extension attributes; hosts must not treat them as telemetry-safe summaries
          - Revision-envelope evidence remains an equality observation rather than authorization, tenant membership, a signature, or proof of durable persistence; CWL and naruon hosts retain authenticated atomic RFC 9110 `If-Match`, tenant isolation, encryption, retention, redaction, and audit policy

          ### Tests
          - Added stable-conflict, successful-restore, moved-document, hostile-reentrancy, destroyed-editor, standalone-handle, Yjs collaboration, strict declaration-consumer, and repository-wide 100% production coverage verification for atomic conflict evidence

          ### Documentation
          - Expanded README and persistence guidance with compile-time evidence pairing, null-evidence retry behavior, no-extra-copy performance guarantees, privacy boundaries, and durable server compare-and-swap ownership
          """
              release = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in release.splitlines()
              )
              write(changelog_path, changelog.replace(marker, marker + release, 1))

          readme_section = """### Revision-guarded restore

          Delayed autosave, AI, template, and review results can be applied under the
          strong revision from which they started:

          ```tsx
          const result = await editorRef.current?.restoreDocumentEnvelopeIfMatch(
            expectedRevision.strongEntityTag,
            incomingEnvelope,
          );

          if (result?.status === 'conflict') {
            if (result.currentRevision === null) {
              // The editor moved or was destroyed. Capture a fresh revision.
            } else {
              // currentRevision and currentEnvelope describe the same frozen
              // document and can enter the host's compare/merge/fork workflow.
              openConflict(result.currentRevision, result.currentEnvelope);
            }
          } else if (result?.status === 'restored') {
            // previousRevision and previousEnvelope describe the exact document
            // replaced by result.envelope.
            recordAcceptedTransition(result);
          }
          ```

          Use `restoreDocumentEnvelopeBytesIfMatch()` for strict UTF-8 envelope bytes.
          Stable mismatch and document movement during asynchronous hashing never replace
          newer content. Inkspan reuses the envelope already created for the guard, so
          returning evidence adds no second document clone, canonicalization, or digest.
          A conflict envelope contains the full document body and must not be copied into
          ordinary telemetry or logs. Durable services must still enforce authenticated,
          atomic RFC 9110 `If-Match` within the write transaction. See
          [`docs/revision-guarded-restore.md`](docs/revision-guarded-restore.md).
          """
          readme_section = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in readme_section.splitlines()
          ) + "\n"
          replace_between(
              "README.md",
              "### Revision-guarded restore\n",
              "\n### Main props\n",
              readme_section,
          )

          design_path = "docs/superpowers/specs/2026-08-04-conflict-evidence-design.md"
          design = read(design_path)
          design = design.replace(
              "readonly currentEnvelope: CwlEditorDocumentEnvelope | null;",
              "readonly currentEnvelope: CwlEditorDocumentEnvelope;",
              1,
          )
          if "readonly currentRevision: null;" not in design:
              stable_variant = """            | {
                readonly status: 'conflict';
                readonly currentRevision: CwlEditorDocumentRevision;
                readonly currentEnvelope: CwlEditorDocumentEnvelope;
              };
          """
              null_variant = """            | {
                readonly status: 'conflict';
                readonly currentRevision: CwlEditorDocumentRevision;
                readonly currentEnvelope: CwlEditorDocumentEnvelope;
              }
            | {
                readonly status: 'conflict';
                readonly currentRevision: null;
                readonly currentEnvelope: null;
              };
          """
              stable_variant = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in stable_variant.splitlines()
              )
              null_variant = "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in null_variant.splitlines()
              )
              if stable_variant not in design:
                  raise SystemExit("design conflict union marker is missing")
              design = design.replace(stable_variant, null_variant, 1)
          write(design_path, design)

          plan_path = "docs/superpowers/plans/2026-08-04-conflict-evidence.md"
          plan = read(plan_path)
          plan = plan.replace(
              "readonly currentEnvelope: CwlEditorDocumentEnvelope | null;",
              "readonly currentEnvelope: CwlEditorDocumentEnvelope;",
              1,
          )
          plan = plan.replace(
              "The exact object reference assertion proves the implementation reuses the already-created envelope instead of cloning it again.",
              "The equality assertion proves the evidence describes the same document; implementation review and provider-call coverage enforce reuse without a second digest.",
              1,
          )
          write(plan_path, plan)

          Path(".github/workflows/finalize-conflict-evidence.yml").unlink()

      - name: Commit finalized release documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md \
            docs/superpowers/specs/2026-08-04-conflict-evidence-design.md \
            docs/superpowers/plans/2026-08-04-conflict-evidence.md \
            .github/workflows/finalize-conflict-evidence.yml
          git commit -m "docs: release Inkspan 0.5.24 conflict evidence"
          git push origin HEAD:feat/conflict-evidence
