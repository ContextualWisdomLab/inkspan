name: Patch collaboration act return

on:
  push:
    branches: [feat/accessible-image-alt-text]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/accessible-image-alt-text
      - name: Normalize act callback return
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/collaboration/CollaborativeCwlEditor.test.tsx')
          text = path.read_text()
          old = "    act(() => leftRef.current!.getEditor()!.commands.undo());\n"
          new = """    act(() => {
      leftRef.current!.getEditor()!.commands.undo();
    });
"""
          if old not in text:
              raise SystemExit('missing act callback anchor')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/collaboration/CollaborativeCwlEditor.test.tsx
          git rm .github/workflows/patch-act-return.yml
          git commit -m "test: normalize collaboration act callback"
          git push origin HEAD:feat/accessible-image-alt-text
