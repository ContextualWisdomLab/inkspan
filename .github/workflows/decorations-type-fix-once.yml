name: Decorations Type Fix Once

on:
  push:
    branches:
      - feat/writing-diagnostics-decorations
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decorations-type-fix-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-type-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply exact public-type corrections
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_path = Path('src/extensions/WritingDiagnostics.ts')
          source = source_path.read_text(encoding='utf-8')
          replacements = (
              ('({ transaction, dispatch }) => {', '({ tr, dispatch }) => {', 3),
              ('normalizeResolvedDiagnostics(transaction.doc, diagnostics)', 'normalizeResolvedDiagnostics(tr.doc, diagnostics)', 1),
              ('installWritingDiagnostics(transaction, generation, diagnostics)', 'installWritingDiagnostics(tr, generation, diagnostics)', 1),
              ('focusWritingDiagnostic(transaction, generation, diagnosticId)', 'focusWritingDiagnostic(tr, generation, diagnosticId)', 1),
              ('clearWritingDiagnostics(transaction)', 'clearWritingDiagnostics(tr)', 1),
          )
          for old, new, expected_count in replacements:
              if source.count(old) != expected_count:
                  raise SystemExit(f'unexpected occurrence count for {old!r}')
              source = source.replace(old, new)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('src/extensions/WritingDiagnostics.test.ts')
          test_source = test_path.read_text(encoding='utf-8')
          old_test = "    expect(writingDiagnosticsPluginKey.key).toContain('cwlWritingDiagnostics');\n"
          new_test = "    expect(typeof writingDiagnosticsPluginKey.getState).toBe('function');\n"
          if test_source.count(old_test) != 1:
              raise SystemExit('unexpected plugin-key assertion count')
          test_path.write_text(test_source.replace(old_test, new_test), encoding='utf-8')
          PY
      - name: Verify focused contracts and public types
        run: |
          pnpm exec vitest run \
            src/extensions/WritingDiagnostics.test.ts \
            src/extensions/WritingDiagnosticsKit.test.ts
          pnpm typecheck
      - name: Remove one-shot workflow and publish validated correction
        env:
          TARGET_BRANCH: feat/writing-diagnostics-decorations
        run: |
          set -euo pipefail
          rm .github/workflows/decorations-type-fix-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/extensions/WritingDiagnostics.ts src/extensions/WritingDiagnostics.test.ts .github/workflows/decorations-type-fix-once.yml
          git diff --cached --check
          git commit -m 'fix(diagnostics): use public command and plugin-key APIs'
          git push origin "HEAD:${TARGET_BRANCH}"
