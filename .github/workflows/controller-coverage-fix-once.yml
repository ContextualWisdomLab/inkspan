name: Controller Coverage Fix Once

on:
  push:
    branches:
      - feat/writing-diagnostics-controller
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controller-coverage-fix-once-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  repair-controller-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Repair stale publication and remove the impossible error fallback
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/useWritingDiagnosticsController.ts')
          source = path.read_text(encoding='utf-8')

          patterns = [
              (
                  r"\n\s*let validationError: WritingDiagnosticError \| null = null;\n",
                  "\n",
              ),
              (
                  r"(?m)^(\s*)validationError =\n\1  error instanceof WritingDiagnosticError\n\1    \? error\n\1    : new WritingDiagnosticError\('contract'\);$",
                  lambda match: (
                      f"{match.group(1)}const validationError =\n"
                      f"{match.group(1)}  error instanceof WritingDiagnosticError\n"
                      f"{match.group(1)}    ? error\n"
                      f"{match.group(1)}    : new WritingDiagnosticError('contract');"
                  ),
              ),
              (
                  r"(?m)^(\s*)const error = validationError \?\? new WritingDiagnosticError\(processed\.errorCode\);\n"
                  r"\1publish\(snapshot\('invalid', nextGeneration, editor\)\);\n"
                  r"\1notifyError\(errorRef\.current, error\);$",
                  lambda match: (
                      f"{match.group(1)}publish(snapshot('invalid', nextGeneration, editor));\n"
                      f"{match.group(1)}notifyError(\n"
                      f"{match.group(1)}  errorRef.current,\n"
                      f"{match.group(1)}  new WritingDiagnosticError(processed.errorCode),\n"
                      f"{match.group(1)});"
                  ),
              ),
              (
                  r"(?m)^(\s*)if \(generationRef\.current !== nextGeneration \|\| editor\.isDestroyed\) return;\n"
                  r"\1const frozenVerified = Object\.freeze\(verified\);$",
                  lambda match: (
                      f"{match.group(1)}if (generationRef.current !== nextGeneration) return;\n"
                      f"{match.group(1)}if (editor.isDestroyed) {{\n"
                      f"{match.group(1)}  publish(snapshot('stale', nextGeneration, editor));\n"
                      f"{match.group(1)}  return;\n"
                      f"{match.group(1)}}}\n"
                      f"{match.group(1)}const frozenVerified = Object.freeze(verified);"
                  ),
              ),
          ]

          for pattern, replacement in patterns:
              source, count = re.subn(pattern, replacement, source, count=1)
              if count != 1:
                  raise SystemExit(f'unexpected replacement count {count} for {pattern}')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify exact controller behavior, coverage, and public types
        run: |
          set -euo pipefail
          pnpm exec vitest run \
            src/components/useWritingDiagnosticsController.test.tsx \
            src/components/useWritingDiagnosticsController.actions.test.tsx \
            src/components/useWritingDiagnosticsController.boundary.test.tsx \
            src/components/useWritingDiagnosticsController.coverage.test.tsx \
            --pool=forks \
            --maxWorkers=1 \
            --coverage \
            --coverage.include=src/components/useWritingDiagnosticsController.ts
          pnpm typecheck
      - name: Publish the validated source repair and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-controller
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/useWritingDiagnosticsController.ts
          git rm .github/workflows/controller-coverage-fix-once.yml
          git diff --cached --check
          git commit -m 'fix(diagnostics): close controller teardown gaps'
          git push origin "HEAD:${TARGET_BRANCH}"
