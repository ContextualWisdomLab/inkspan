name: Release Workflow Root-Cause Repair

on:
  push:
    branches:
      - fix/release-workflow-parse
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-workflow-rac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair-release-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Apply exact release workflow repairs
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release.yml')
          source = path.read_text(encoding='utf-8')
          replacements = (
              (
                  "        run: python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt\n",
                  "        run: |\n          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt\n",
              ),
              (
                  "              process.stdout.write(url.origin);\n              NODE\n              )\" || {\n",
                  "              process.stdout.write(url.origin);\n          NODE\n              )\" || {\n",
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit('release workflow did not contain exactly one expected invalid construct')
              source = source.replace(old, new)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify YAML syntax with the runner's Ruby parser
        run: ruby -e "require 'psych'; Psych.parse_file('.github/workflows/release.yml')"
      - name: Download checksum-pinned actionlint 1.7.12
        run: |
          set -euo pipefail
          archive='actionlint_1.7.12_linux_amd64.tar.gz'
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check --strict
          mkdir actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
      - name: Diagnose actionlint findings
        id: actionlint
        continue-on-error: true
        run: |
          set -euo pipefail
          if output="$(./actionlint-bin/actionlint -oneline .github/workflows/release.yml 2>&1)"; then
            exit 0
          fi
          while IFS= read -r line; do
            escaped="${line//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error file=.github/workflows/release.yml,line=1::$escaped"
          done <<< "$output"
          exit 1
      - name: Remove one-shot repair workflow and commit validated repair
        if: steps.actionlint.outcome == 'success'
        env:
          TARGET_BRANCH: fix/release-workflow-parse
        run: |
          set -euo pipefail
          rm .github/workflows/release-workflow-rac.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/release.yml .github/workflows/release-workflow-rac.yml
          git diff --cached --check
          git commit -m 'fix(ci): make release workflow executable'
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Enforce actionlint validation
        if: steps.actionlint.outcome != 'success'
        run: exit 1
