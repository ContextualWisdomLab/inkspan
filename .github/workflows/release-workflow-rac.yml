name: Release Workflow Root-Cause Analysis

on:
  push:
    branches:
      - fix/release-workflow-parse
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-workflow-rac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify YAML syntax with the runner's Ruby parser
        id: yaml_syntax
        continue-on-error: true
        run: |
          set -euo pipefail
          if output="$(ruby -e "require 'psych'; Psych.parse_file('.github/workflows/release.yml')" 2>&1)"; then
            exit 0
          fi
          escaped="${output//'%'/'%25'}"
          escaped="${escaped//$'\r'/'%0D'}"
          escaped="${escaped//$'\n'/'%0A'}"
          echo "::error file=.github/workflows/release.yml,line=1::$escaped"
          exit 1
      - name: Download checksum-pinned actionlint 1.7.12
        run: |
          set -euo pipefail
          archive='actionlint_1.7.12_linux_amd64.tar.gz'
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/$archive"
          printf '%s  %s\n' \
            '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$archive" | sha256sum --check --strict
          mkdir actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
      - name: Validate the release workflow with actionlint
        id: actionlint
        continue-on-error: true
        run: |
          set -euo pipefail
          if output="$(./actionlint-bin/actionlint -oneline .github/workflows/release.yml 2>&1)"; then
            exit 0
          fi
          while IFS= read -r line; do
            escaped="${line//'%'/'%25'}"
            echo "::error file=.github/workflows/release.yml,line=1::$escaped"
          done <<< "$output"
          exit 1
      - name: Enforce both validators
        if: always()
        run: |
          test '${{ steps.yaml_syntax.outcome }}' = 'success'
          test '${{ steps.actionlint.outcome }}' = 'success'
