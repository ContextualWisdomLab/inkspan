name: Editor Actions Integration Once

on:
  push:
    branches:
      - feat/writing-diagnostics-editor-actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-actions-integration-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrate-public-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integrate diagnostics into the standalone editor
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              if source.count(old) != 1:
                  raise SystemExit(f'{label} anchor count was {source.count(old)}')
              return source.replace(old, new, 1)

          types_path = Path('src/types.ts')
          types = types_path.read_text(encoding='utf-8')
          old = (
              "import type {\n"
              "  ClipboardConfig,\n"
              "  ClipboardSanitizationError,\n"
              "} from './extensions/SafeClipboard.js';\n"
          )
          new = old + (
              "import type {\n"
              "  CwlWritingDiagnostic,\n"
              "  WritingDiagnosticError,\n"
              "} from './writingDiagnostics.js';\n"
              "import type { CwlWritingDiagnosticActionEvent } from "
              "'./components/useWritingDiagnosticsController.js';\n"
          )
          types = replace_once(types, old, new, 'types imports')
          old = (
              "  /** Whether the host form requires editor input before submission. */\n"
              "  ariaRequired?: boolean;\n"
              "}\n"
          )
          new = (
              "  /** Whether the host form requires editor input before submission. */\n"
              "  ariaRequired?: boolean;\n"
              "  /** Host-supplied diagnostics already produced by a trusted external reviewer. */\n"
              "  writingDiagnostics?: readonly CwlWritingDiagnostic[];\n"
              "  /** Privacy-minimized observer for explicit diagnostic actions. */\n"
              "  onWritingDiagnosticAction?: (\n"
              "    event: CwlWritingDiagnosticActionEvent,\n"
              "  ) => void;\n"
              "  /** Redacted observer for structural verification failures. */\n"
              "  onWritingDiagnosticsError?: (error: WritingDiagnosticError) => void;\n"
              "  /** Accessible name for the built-in writing-guidance region. */\n"
              "  writingDiagnosticsLabel?: string;\n"
              "  /** Include a compact diagnostic appendix in printed output. */\n"
              "  printWritingDiagnostics?: boolean;\n"
              "}\n"
          )
          types = replace_once(types, old, new, 'types props')
          types_path.write_text(types, encoding='utf-8')

          editor_path = Path('src/components/CwlEditor.tsx')
          editor = editor_path.read_text(encoding='utf-8')
          old = (
              "import { useEditorHandle } from './useEditorHandle.js';\n"
              "import { useLatestRef } from './useLatestRef.js';\n"
          )
          new = (
              "import { useEditorHandle } from './useEditorHandle.js';\n"
              "import { useLatestRef } from './useLatestRef.js';\n"
              "import { useWritingDiagnosticsController } from "
              "'./useWritingDiagnosticsController.js';\n"
              "import { WritingDiagnosticsPanel } from './WritingDiagnosticsPanel.js';\n"
          )
          editor = replace_once(editor, old, new, 'editor imports')
          old = (
              "      ariaInvalid,\n"
              "      ariaRequired,\n"
              "    },\n"
          )
          new = (
              "      ariaInvalid,\n"
              "      ariaRequired,\n"
              "      writingDiagnostics,\n"
              "      onWritingDiagnosticAction,\n"
              "      onWritingDiagnosticsError,\n"
              "      writingDiagnosticsLabel,\n"
              "      printWritingDiagnostics,\n"
              "    },\n"
          )
          editor = replace_once(editor, old, new, 'editor props')
          old = (
              "    useEditorHandle(ref, editor, modeRef);\n"
              "\n"
              "    useEffect(() => {\n"
          )
          new = (
              "    useEditorHandle(ref, editor, modeRef);\n"
              "\n"
              "    const writingDiagnosticsController = useWritingDiagnosticsController({\n"
              "      editor,\n"
              "      diagnostics: writingDiagnostics,\n"
              "      onAction: onWritingDiagnosticAction,\n"
              "      onError: onWritingDiagnosticsError,\n"
              "    });\n"
              "\n"
              "    useEffect(() => {\n"
          )
          editor = replace_once(editor, old, new, 'editor controller')
          old = (
              "        onFormReset={editor && observesFormReset ? handleFormReset : undefined}\n"
              "      />\n"
          )
          new = (
              "        onFormReset={editor && observesFormReset ? handleFormReset : undefined}\n"
              "        writingDiagnosticsPanel={\n"
              "          writingDiagnostics === undefined ? undefined : (\n"
              "            <WritingDiagnosticsPanel\n"
              "              controller={writingDiagnosticsController}\n"
              "              label={writingDiagnosticsLabel ?? 'Writing guidance'}\n"
              "              printEnabled={printWritingDiagnostics}\n"
              "            />\n"
              "          )\n"
              "        }\n"
              "      />\n"
          )
          editor = replace_once(editor, old, new, 'editor frame')
          editor_path.write_text(editor, encoding='utf-8')
          PY
      - name: Verify the focused public integration
        run: |
          pnpm exec vitest run src/components/CwlEditor.writingDiagnostics.test.tsx --pool=forks --maxWorkers=1
          pnpm typecheck
      - name: Publish the validated integration and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-editor-actions
        run: |
          set -euo pipefail
          rm .github/workflows/editor-actions-integration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types.ts src/components/CwlEditor.tsx .github/workflows/editor-actions-integration-once.yml
          git diff --cached --check
          git commit -m 'feat(diagnostics): integrate guidance into standalone editor'
          git push origin "HEAD:${TARGET_BRANCH}"
