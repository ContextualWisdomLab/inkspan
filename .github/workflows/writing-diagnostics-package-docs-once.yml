name: Writing Diagnostics Package Docs Once

on:
  push:
    branches:
      - feat/writing-diagnostics-package
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: writing-diagnostics-package-docs-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  document-public-subpath:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Document framework-neutral writing-diagnostics package boundary
        run: |
          python <<'PY'
          from pathlib import Path

          distribution_path = Path('docs/package-distribution.md')
          distribution = distribution_path.read_text(encoding='utf-8')
          row_anchor = "| `@contextualwisdomlab/cwl-editor/text-position-selector` | `implemented_on_protected_main` — React-free text-position projection core implementing W3C `TextPositionSelector`; interactive capture, revision binding, authorization, persistence, and re-anchoring remain outside this subpath |\n"
          row = "| `@contextualwisdomlab/cwl-editor/writing-diagnostics` | React-free revision-bound writing-diagnostic validation and text-position projection/resolution utilities; semantic review, model calls, policy, persistence, authorization, and editor mutation remain outside this subpath |\n"
          if row not in distribution:
              if distribution.count(row_anchor) != 1:
                  raise SystemExit('distribution row anchor changed')
              distribution = distribution.replace(row_anchor, row_anchor + row, 1)
          boundary_anchor = "- The text-position-selector subpath deliberately exposes only the deterministic\n  projection constants, error type, selector constructor, and public value\n  types. It does not expose the React imperative handle that captures editor\n  state or bind a selector to a document revision. Hosts remain responsible for\n  annotation identifiers/bodies, source-resource identity, authorization,\n  tenancy, persistence, audit, and cross-revision re-anchoring.\n"
          boundary = boundary_anchor + "- The writing-diagnostics subpath deliberately exposes only strict diagnostic\n  validation, bounded diagnostic errors, deterministic text-projection mapping,\n  and exact `TextPositionSelector` resolution. It imports no React, Yjs, provider,\n  network, credential, model, naruon, or contextual-orchestrator runtime. It never\n  decides whether authored text is wrong and never applies a replacement. The\n  host owns semantic review, policy admission, authorization, persistence,\n  revision capture, and any editor mutation.\n"
          if 'The writing-diagnostics subpath deliberately exposes only strict diagnostic' not in distribution:
              if distribution.count(boundary_anchor) != 1:
                  raise SystemExit('distribution boundary anchor changed')
              distribution = distribution.replace(boundary_anchor, boundary, 1)
          verify_anchor = "5. imports the root, collaboration, converter, autosave, envelope-identity,\n   revision-evidence, text-position-selector, and Markdown surfaces through their\n"
          verify_replacement = "5. imports the root, collaboration, converter, autosave, envelope-identity,\n   revision-evidence, text-position-selector, writing-diagnostics, and Markdown surfaces through their\n"
          if verify_anchor in distribution:
              distribution = distribution.replace(verify_anchor, verify_replacement, 1)
          distribution_path.write_text(distribution, encoding='utf-8')

          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          capability_anchor = "- **Standalone conversion utilities** — browser/Node data-URI and base64 helpers\n  are available without React or TipTap.\n"
          capability = capability_anchor + "- **Framework-neutral writing diagnostics** — `@contextualwisdomlab/cwl-editor/writing-diagnostics` validates host-supplied revision-bound diagnostics and resolves exact text-position ranges without importing React, Yjs, a model SDK, credentials, or network authority. Semantic judgment and mutation remain host-owned.\n"
          if '@contextualwisdomlab/cwl-editor/writing-diagnostics` validates host-supplied' not in readme:
              if readme.count(capability_anchor) != 1:
                  raise SystemExit('README capability anchor changed')
              readme = readme.replace(capability_anchor, capability, 1)
          table_anchor = "| Text-position selector | `@contextualwisdomlab/cwl-editor/text-position-selector` | React-free deterministic W3C `TextPositionSelector` projection core |\n"
          table_row = "| Writing diagnostics | `@contextualwisdomlab/cwl-editor/writing-diagnostics` | React-free revision-bound diagnostic validation and exact text-position projection/resolution core |\n"
          if table_row not in readme:
              if readme.count(table_anchor) != 1:
                  raise SystemExit('README table anchor changed')
              readme = readme.replace(table_anchor, table_anchor + table_row, 1)
          readme_path.write_text(readme, encoding='utf-8')
          PY
      - name: Verify package documentation contract
        run: pnpm exec vitest run src/packageDistributionDocumentation.test.ts src/writingDiagnosticsPackage.test.ts --pool=forks --maxWorkers=1
      - name: Publish documentation and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-package
        run: |
          set -euo pipefail
          rm .github/workflows/writing-diagnostics-package-docs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/package-distribution.md .github/workflows/writing-diagnostics-package-docs-once.yml
          git diff --cached --check
          git commit -m 'docs(diagnostics): document public package boundary'
          git push origin "HEAD:${TARGET_BRANCH}"
