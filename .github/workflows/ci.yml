name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # pnpm version comes from the package.json "packageManager" field
      # (pnpm 10+), which is required to read `overrides` from
      # pnpm-workspace.yaml consistently with the committed lockfile.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with 100% coverage
        run: pnpm coverage
      - name: Build library
        run: pnpm build
      - name: Verify packed package consumers
        run: pnpm verify:package
      - name: Build demo
        run: pnpm build:demo

  office:
    name: Office / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: office
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: office/requirements-ci.txt
      - name: Install hash-locked dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify 100% docstring coverage
        run: python scripts/check_docstrings.py
      - name: Test with 100% branch coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify packaged schema and license
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "inkspan_office/schema.json" in names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          PY

  finalize-revision-guarded-restore:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feat/revision-guarded-restore'
    needs: [build-and-test, office]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/revision-guarded-restore
          fetch-depth: 0
      - name: Finalize release metadata and remove temporary workflows
        shell: python
        run: |
          from pathlib import Path

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          release_heading = "## [0.5.23] — 2026-08-04"
          if release_heading not in changelog:
              marker = "## [Unreleased]\n"
              if marker not in changelog:
                  raise SystemExit("CHANGELOG Unreleased marker is missing")
              release = '''

## [0.5.23] — 2026-08-04

### Added
- `restoreDocumentEnvelopeIfMatch()` and `restoreDocumentEnvelopeBytesIfMatch()` for applying validated object/JSON or strict UTF-8 envelopes only when the active editor still matches an expected Inkspan SHA-256 strong entity tag
- Frozen `CwlEditorIfMatchRestoreResult` conflict/restored outcomes and matching shared `CwlEditorHandle` methods for standalone and provider-neutral collaborative surfaces

### Changed
- Package version **0.5.23**
- Existing envelope preparation is now reusable without mutation, keeping ordinary restore and conditional restore on one active-schema validation path
- Pure and imperative conditional restore accept optional resource limits and digest-provider injection without adding transport or persistence coupling

### Reliability
- Stable revision mismatch leaves the editor unchanged and returns the current revision without parsing the incoming source
- A document change while SHA-256 is pending returns a conflict with `currentRevision: null`, preventing a stale captured validator from authorizing replacement
- Matching restore performs complete envelope and active-schema validation before one callback-suppressed `setContent(..., false)` mutation with no intervening asynchronous boundary
- Selection-only transactions preserve the immutable ProseMirror document reference and do not create false content conflicts

### Security
- Expected validators must exactly match Inkspan's quoted lowercase `sha256` strong-tag format; weak, uppercase, unquoted, alternate-algorithm, control-containing, and extended values fail before document access or hashing
- Local revision matching is not authorization, a signature, tenant membership, or proof of persistence; CWL and naruon hosts retain authenticated transport, server-side atomic `If-Match`, tenant isolation, persistence, audit, and conflict policy
- Collaborative conditional restore still requires explicit host authorization because a successful replacement mutates the host-owned Yjs document

### Tests
- Added matching object/byte, stable mismatch, document-moved, selection-only, malformed-tag, schema-failure, empty-handle, imperative-handle, ESM, CommonJS, strict declaration-consumer, and repository-wide 100% coverage verification

### Documentation
- Added `docs/revision-guarded-restore.md` and expanded imperative persistence guidance with result semantics, local race boundaries, callback behavior, collaboration authorization, server compare-and-swap, and CWL/naruon ownership
'''
              changelog_path.write_text(
                  changelog.replace(marker, marker + release, 1),
                  encoding="utf-8",
              )

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          heading = "### Revision-guarded restore"
          if heading not in readme:
              marker = (
                  "`insertValue` is mode-aware, inserts at the current selection, and triggers the\n"
                  "normal `onChange` path without wiping the document.\n"
              )
              if marker not in readme:
                  raise SystemExit("README imperative API marker is missing")
              section = '''

### Revision-guarded restore

Delayed autosave, AI, template, and review results can be applied under the
strong revision from which they started:

```tsx
const result = await editorRef.current?.restoreDocumentEnvelopeIfMatch(
  expectedRevision.strongEntityTag,
  incomingEnvelope,
);

if (result?.status === 'conflict') {
  // Reload, compare, merge, fork, or retry from a fresh host-owned revision.
}
```

Use `restoreDocumentEnvelopeBytesIfMatch()` for strict UTF-8 envelope bytes.
Stable mismatch and document movement during asynchronous hashing never replace
newer content. Durable services must still enforce authenticated, atomic RFC
9110 `If-Match` within the write transaction. See
[`docs/revision-guarded-restore.md`](docs/revision-guarded-restore.md).
'''
              readme_path.write_text(
                  readme.replace(marker, marker + section, 1),
                  encoding="utf-8",
              )

          for path in (
              Path(".github/workflows/finalize-revision-guarded-restore.yml"),
          ):
              path.unlink(missing_ok=True)
      - name: Restore canonical CI workflow
        run: git checkout origin/main -- .github/workflows/ci.yml
      - name: Commit finalized release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md README.md .github/workflows/ci.yml .github/workflows/finalize-revision-guarded-restore.yml
          if git diff --cached --quiet; then
            echo "Release metadata is already finalized."
            exit 0
          fi
          git commit -m "docs: finalize Inkspan 0.5.23"
          git push origin HEAD:feat/revision-guarded-restore
