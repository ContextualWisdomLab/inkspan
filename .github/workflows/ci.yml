name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # pnpm version comes from the package.json "packageManager" field
      # (pnpm 10+), which is required to read `overrides` from
      # pnpm-workspace.yaml consistently with the committed lockfile.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with 100% coverage
        run: pnpm coverage
      - name: Build library
        run: pnpm build
      - name: Verify packed package consumers
        run: pnpm verify:package
      - name: Build demo
        run: pnpm build:demo

  office:
    name: Office / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: office
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: office/requirements-ci.txt
      - name: Install hash-locked dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify 100% docstring coverage
        run: python scripts/check_docstrings.py
      - name: Test with 100% branch coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify packaged schema and license
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "inkspan_office/schema.json" in names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          PY

  finalize-duplicate-name-release:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'security/reject-duplicate-json-names' && github.actor != 'github-actions[bot]'
    needs: [build-and-test, office]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: security/reject-duplicate-json-names
          fetch-depth: 0
      - name: Insert validated release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          anchor = '## [Unreleased]\n\n'
          section = '''## [0.5.16] — 2026-08-04

### Changed
- Package version **0.5.16**
- Raw JSON envelope parsing now scans object structure before `JSON.parse()` and rejects duplicate names at every nesting depth
- Escaped-equivalent names such as `name` and `\\u006eame` compare as the same decoded property name

### Security
- Ambiguous signed, hashed, audited, or migrated JSON cannot silently retain only the final duplicate value
- The scanner is iterative, keeps name sets scoped per object, and reports a bounded error without exposing names or values
- Standard JSON syntax validation remains authoritative, while CWL and naruon hosts retain request-byte limits, authorization, tenant isolation, migration, active-schema validation, and cryptographic policy

### Tests
- Root and nested duplicates, escaped-equivalent names, independent object scopes, arrays, every JSON value form, malformed-input delegation, redacted errors, and valid JSON diagnostics are covered under the repository-wide 100% TypeScript coverage gate

### Documentation
- Updated `docs/canonical-document-envelope.md` with I-JSON uniqueness, scanner behavior, malformed-input handling, and host request-size responsibilities

'''
          if '## [0.5.16]' not in text:
              if anchor not in text:
                  raise SystemExit('Unreleased changelog anchor is missing')
              path.write_text(text.replace(anchor, anchor + section, 1), encoding='utf-8')
          PY
      - name: Restore canonical CI and commit release notes
        shell: bash
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md .github/workflows/ci.yml
          git commit -m "docs: record duplicate-name hardening release"
          git push origin HEAD:security/reject-duplicate-json-names
