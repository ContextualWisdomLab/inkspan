name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # pnpm version comes from the package.json "packageManager" field
      # (pnpm 10+), which is required to read `overrides` from
      # pnpm-workspace.yaml consistently with the committed lockfile.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test with 100% coverage
        run: pnpm coverage
      - name: Build library
        run: pnpm build
      - name: Verify packed package consumers
        run: pnpm verify:package
      - name: Build demo
        run: pnpm build:demo

  office:
    name: Office / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: office
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: office/requirements-ci.txt
      - name: Install hash-locked dependencies
        run: "python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt"
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify 100% docstring coverage
        run: python scripts/check_docstrings.py
      - name: Test with 100% branch coverage
        run: |
          coverage run -m pytest
          coverage report
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify packaged schema and license
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "inkspan_office/schema.json" in names
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          PY

  finalize-revision-evidence:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/revision-evidence-capture' && github.repository == 'ContextualWisdomLab/inkspan' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: feat/revision-evidence-capture
          fetch-depth: 0
      - name: Finalize release metadata without executing repository code
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          if marker not in changelog_text:
              raise SystemExit('CHANGELOG Unreleased marker is missing')
          release_heading = '## [0.5.25] — 2026-08-04'
          if release_heading not in changelog_text:
              release_lines = [
                  '',
                  '',
                  release_heading,
                  '',
                  '### Added',
                  '- `CwlEditorHandle.getDocumentEnvelopeRevisionEvidence()` for capturing one frozen versioned envelope together with the exact SHA-256 revision derived from that same capture',
                  '- Public `CwlEditorDocumentRevisionEvidence` contract for standalone and provider-neutral collaborative editor surfaces',
                  '',
                  '### Changed',
                  '- Package version **0.5.25**',
                  '- Imperative persistence guidance now directs autosave, AI, template, and review workflows to capture revision-envelope evidence in one call',
                  '',
                  '### Reliability',
                  '- Asynchronous hashing can no longer cause a host to pair a separately captured envelope with a revision from a different editor state',
                  '- A document change while hashing leaves the returned evidence pair stable and internally consistent without rereading the editor',
                  '',
                  '### Performance',
                  '- Evidence capture creates one frozen envelope and hashes its canonical bytes; it adds no second editor read, document traversal, clone, parser pass, schema reconstruction, or provider call',
                  '',
                  '### Security',
                  '- Captured envelopes contain the full client-controlled document and inherit host authorization, encryption, redaction, retention, residency, and audit requirements',
                  '- Revision evidence remains an equality validator rather than authorization, tenant membership, cryptographic authenticity, or proof of durable persistence; hosts retain authenticated atomic RFC 9110 `If-Match`',
                  '',
                  '### Tests',
                  '- Added lifecycle fallback, asynchronous editor-movement, exact pairing, freezing, strict packed TypeScript declaration, and repository-wide coverage verification',
                  '',
                  '### Documentation',
                  '- Expanded imperative persistence guidance with an atomic autosave base example, local race semantics, privacy handling, and CWL/naruon ownership boundaries',
                  '',
              ]
              release_section = '\n'.join(release_lines)
              changelog.write_text(
                  changelog_text.replace(marker, marker + release_section, 1),
                  encoding='utf-8',
              )

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          readme_marker = '### Revision-guarded restore\n'
          if readme_marker not in readme_text:
              raise SystemExit('README revision-guarded restore marker is missing')
          capture_heading = '### Atomic revision-envelope capture'
          if capture_heading not in readme_text:
              capture_lines = [
                  capture_heading,
                  '',
                  'Autosave, AI, template, and review operations should capture their document and',
                  'strong revision in one call so asynchronous SHA-256 hashing cannot pair values',
                  'from different editor states:',
                  '',
                  '```tsx',
                  'const captured =',
                  '  await editorRef.current?.getDocumentEnvelopeRevisionEvidence();',
                  '',
                  'if (captured) {',
                  '  startOperation({',
                  '    envelope: captured.envelope,',
                  '    expectedStrongEntityTag: captured.revision.strongEntityTag,',
                  '  });',
                  '}',
                  '```',
                  '',
                  'The returned `CwlEditorDocumentRevisionEvidence` is frozen and derived from one',
                  'frozen envelope without a second editor read. It is local equality evidence, not',
                  'a signature, authorization decision, tenant identifier, or durable commit.',
                  'Hosts retain authenticated atomic RFC 9110 `If-Match`, persistence, encryption,',
                  'retention, redaction, and audit policy. See',
                  '[`docs/imperative-envelope-persistence.md`](docs/imperative-envelope-persistence.md).',
                  '',
                  '',
              ]
              capture_section = '\n'.join(capture_lines)
              readme.write_text(
                  readme_text.replace(
                      readme_marker,
                      capture_section + readme_marker,
                      1,
                  ),
                  encoding='utf-8',
              )
          PY
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md .github/workflows/ci.yml
          git diff --cached --check
          git commit -m 'docs: finalize atomic revision evidence release'
          git push origin HEAD:feat/revision-evidence-capture
