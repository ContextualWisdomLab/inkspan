name: Agent workspace snapshot

on:
  push:
    branches:
      - agent/318-spreadsheet-body-import

permissions:
  contents: read

concurrency:
  group: agent-workspace-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact contributor head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install the immutable workspace
        run: pnpm install --frozen-lockfile
      - name: Stage the exact official spreadsheet parser without lifecycle scripts
        run: |
          set -euo pipefail
          pnpm add --save-exact --ignore-scripts https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz
          node --input-type=module -e "const XLSX=await import('xlsx'); if (XLSX.version !== '0.20.3') throw new Error('Unexpected SheetJS runtime version: '+XLSX.version);"
          grep -F 'cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz' pnpm-lock.yaml
      - name: Archive the exact source and installed dependency graph
        run: |
          set -euo pipefail
          tar \
            --exclude=./.git \
            --exclude=./coverage \
            --exclude=./dist \
            --exclude=./office/.coverage \
            --exclude=./office/dist \
            -czf "$RUNNER_TEMP/inkspan-agent-workspace.tgz" .
      - name: Upload the bounded read-only workspace snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: inkspan-agent-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/inkspan-agent-workspace.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
