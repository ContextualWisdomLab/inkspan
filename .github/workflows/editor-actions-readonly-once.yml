name: Editor Actions Readonly Once

on:
  push:
    branches:
      - feat/writing-diagnostics-editor-actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-actions-readonly-once-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  enforce-readonly-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce read-only diagnostic application
        run: |
          python <<'PY'
          from pathlib import Path

          controller_path = Path('src/components/useWritingDiagnosticsController.ts')
          controller = controller_path.read_text(encoding='utf-8')
          marker = '  const applyDiagnostic = useCallback(\n'
          marker_index = controller.find(marker)
          if marker_index < 0:
              raise SystemExit('applyDiagnostic marker missing')
          prefix = controller[:marker_index]
          suffix = controller[marker_index:]
          old_guard = (
              '      const active = currentRef.current;\n'
              '      if (\n'
              "        active.status !== 'active' ||\n"
              '        active.editor === null ||\n'
              '        active.editor.isDestroyed\n'
              '      ) {\n'
          )
          new_guard = (
              '      const active = currentRef.current;\n'
              '      if (\n'
              "        active.status !== 'active' ||\n"
              '        active.editor === null ||\n'
              '        !active.editor.isEditable ||\n'
              '        active.editor.isDestroyed\n'
              '      ) {\n'
          )
          if suffix.count(old_guard) != 1:
              raise SystemExit(
                  f'apply read-only guard count was {suffix.count(old_guard)}'
              )
          controller = prefix + suffix.replace(old_guard, new_guard, 1)
          controller_path.write_text(controller, encoding='utf-8')

          editor_path = Path('src/components/CwlEditor.tsx')
          editor = editor_path.read_text(encoding='utf-8')
          old_callback = (
              '              onApplyDiagnostic={(diagnosticId) => {\n'
              '                void writingDiagnosticsController.applyDiagnostic(diagnosticId);\n'
              '              }}\n'
          )
          new_callback = (
              '              onApplyDiagnostic={\n'
              '                editable\n'
              '                  ? (diagnosticId) => {\n'
              '                      void writingDiagnosticsController.applyDiagnostic(\n'
              '                        diagnosticId,\n'
              '                      );\n'
              '                    }\n'
              '                  : undefined\n'
              '              }\n'
          )
          if editor.count(old_callback) != 1:
              raise SystemExit(
                  f'read-only panel callback count was {editor.count(old_callback)}'
              )
          editor = editor.replace(old_callback, new_callback, 1)
          editor_path.write_text(editor, encoding='utf-8')
          PY
      - name: Verify read-only behavior
        run: |
          pnpm exec vitest run \
            src/components/CwlEditor.writingDiagnosticApply.test.tsx \
            src/components/CwlEditor.writingDiagnostics.test.tsx \
            src/components/useEditorHandle.test.tsx \
            --pool=forks --maxWorkers=1
          pnpm typecheck
      - name: Publish validated read-only guard and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-editor-actions
        run: |
          set -euo pipefail
          rm .github/workflows/editor-actions-readonly-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/useWritingDiagnosticsController.ts \
            src/components/CwlEditor.tsx \
            .github/workflows/editor-actions-readonly-once.yml
          git diff --cached --check
          git commit -m 'fix(diagnostics): keep read-only editors immutable'
          git push origin "HEAD:${TARGET_BRANCH}"
