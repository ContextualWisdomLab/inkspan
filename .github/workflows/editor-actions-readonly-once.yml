name: Editor Actions Readonly Once

on:
  push:
    branches:
      - feat/writing-diagnostics-editor-actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editor-actions-readonly-once-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  enforce-readonly-application:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce read-only diagnostic application
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Verify read-only behavior
        run: |
          pnpm exec vitest run \
            src/components/CwlEditor.writingDiagnosticApply.test.tsx \
            src/components/CwlEditor.writingDiagnostics.test.tsx \
            src/components/useEditorHandle.test.tsx \
            --pool=forks --maxWorkers=1
          pnpm typecheck
      - name: Publish validated read-only guard and remove this workflow
        env:
          TARGET_BRANCH: feat/writing-diagnostics-editor-actions
        run: |
          set -euo pipefail
          rm .github/workflows/editor-actions-readonly-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/components/useWritingDiagnosticsController.ts \
            src/components/CwlEditor.tsx \
            .github/workflows/editor-actions-readonly-once.yml
          git diff --cached --check
          git commit -m 'fix(diagnostics): keep read-only editors immutable'
          git push origin "HEAD:${TARGET_BRANCH}"
