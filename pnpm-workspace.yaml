packages:
  - .

onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
# Security: force patched versions across the whole dependency tree.
# vitest / vite-node otherwise resolve a transitive vite@5 (GHSA-4w7w-66w2-5vf9,
# GHSA-v6wh-96g9-6wx3, GHSA-fx2h-pf6j-xcff) and esbuild<0.24.3 (GHSA-67mh-4wv8-2f99).
overrides:
  vite: ^6.4.3
  esbuild: ^0.25.0
